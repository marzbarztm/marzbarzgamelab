<style>

.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 46px 46px;gap:8px;align-items:center;min-height:62px}.hudPanel{position:relative;width:100%;height:62px;background:center/100% 100% no-repeat;display:grid;place-items:center;text-align:center;overflow:visible}.hudPanel.score{background-image:url('hud_score_panel.png')}.hudPanel>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:2px 0 0;line-height:1;width:100%}.hudPanel br{display:none}.hudPanel b{display:block;width:72%;font-size:14px;line-height:1;white-space:nowrap;overflow:visible;text-align:center}.hudPanel small{display:block;margin-top:0;font-size:7px;line-height:1;letter-spacing:.7px;opacity:.8}
#stageTimer{position:relative;width:100%;height:62px;background:url('hud_score_panel.png') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;font-weight:800;line-height:1;overflow:visible}#stageTimer #timeLabel{font-size:7px;letter-spacing:.8px;opacity:.8}#stageTimer #timeLeft{font-size:14px;line-height:1;white-space:nowrap}#stageTimer.danger #timeLeft{color:#ff2a2a}#bonusToast{position:absolute;top:66px;left:0;max-width:44%;min-height:20px;font-size:10px;font-weight:700;letter-spacing:.6px;text-align:left;text-shadow:0 2px 3px #000;opacity:0;transform:translateY(-3px);transition:opacity .12s linear,transform .12s linear;pointer-events:none}#bonusToast.show{opacity:1;transform:translateY(0)}
.hudIcon{width:46px;height:46px;object-fit:contain;pointer-events:auto;cursor:pointer;align-self:center;justify-self:center}
#tray{position:absolute;z-index:27;bottom:max(4px,calc(env(safe-area-inset-bottom) + 2px));left:50%;transform:translateX(-50%);width:72%;height:auto;aspect-ratio:1639/522;background:url('hud_powerup_tray.png') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;gap:2.5%;pointer-events:none}.pu{position:relative;width:20%;aspect-ratio:1;border:0;background:transparent;padding:0;touch-action:manipulation;pointer-events:auto}.pu img{width:100%;height:100%;object-fit:contain}.pu.empty img{visibility:hidden}.pu.disabled:not(.empty){filter:grayscale(1) brightness(.45)}.charge{display:none}
#rot{position:absolute;z-index:28;left:4%;right:4%;bottom:max(78px,calc(env(safe-area-inset-bottom) + 72px));height:34px;pointer-events:none}.rotFrame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:2;pointer-events:none}.rotBlocks{position:absolute;left:4.5%;right:4.5%;top:27%;bottom:27%;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;z-index:1}.rotBlock{background:rgba(12,8,8,.9);border:1px solid rgba(140,0,0,.32);transition:filter .08s linear,transform .08s linear}.rotBlock.filled{background:#b20d16;border-color:#ff3434;box-shadow:inset 0 0 0 1px rgba(255,0,0,.18)}.rotBlock.justFilled{animation:rotBlockPop .22s steps(2,end)}@keyframes rotBlockPop{50%{filter:brightness(2);transform:scaleY(1.3)}}
#spawnRail{position:absolute;z-index:28;left:4%;right:4%;top:clamp(82px,18vw,96px);height:30px;pointer-events:none}#spawnRail .spawnRailFrame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:2}#spawnRail .spawnRailFill{position:absolute;left:4.5%;right:4.5%;top:27%;bottom:27%;background:#030303;z-index:1;transform-origin:left center;transition:transform .12s linear,background .12s linear}#arena{position:absolute;top:clamp(112px,25vw,126px);left:0;right:0;bottom:118px;overflow:hidden}
.sprite{position:absolute;object-fit:contain;touch-action:none;will-change:transform;z-index:8}.powerPickup{position:absolute;width:66px;height:66px;object-fit:contain;z-index:24;cursor:pointer;filter:drop-shadow(0 0 8px rgba(255,255,255,.55));animation:pickupPulse .75s ease-in-out infinite alternate}@keyframes pickupPulse{to{transform:scale(1.12);filter:drop-shadow(0 0 13px rgba(255,255,255,.9))}}.powerActor{z-index:38}.maggotFalling{filter:drop-shadow(0 5px 4px rgba(0,0,0,.55))}.fly{width:68px;height:68px}.maggot{width:56px;height:56px}.fx{position:absolute;width:80px;height:80px;object-fit:contain;pointer-events:none;z-index:12;animation:pop .35s ease-out forwards}@keyframes pop{to{transform:scale(1.4);opacity:0}}
#banner{display:none;position:absolute;z-index:45;left:50%;top:50%;transform:translate(-50%,-50%);width:86%;object-fit:contain;pointer-events:none}.showBanner{display:block!important;animation:banner .9s ease both}.stageBanner{display:block!important;opacity:0;transition:opacity .45s ease;animation:none!important}.stageBanner.visible{opacity:1}@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(.98)}}
#powerStage{position:absolute;inset:0;z-index:35;pointer-events:none}.powerActor{position:absolute;object-fit:contain}.dualityTarget{pointer-events:auto}
#edgeGlow{position:absolute;inset:0;z-index:58;pointer-events:none;opacity:0;border:4px solid transparent;transition:opacity .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease}
#edgeGlow.active{opacity:.28;animation:edgePulse 1.55s ease-in-out infinite}
#edgeGlow.glow-magnet{border-color:#49a9ff;background:rgba(45,130,255,.008);box-shadow:inset 0 0 14px 3px rgba(45,130,255,.32)}
#edgeGlow.glow-pollination{border-color:#60ff54;background:rgba(65,255,65,.007);box-shadow:inset 0 0 14px 3px rgba(65,255,65,.30)}
#edgeGlow.glow-love{border-color:#ff56b7;background:rgba(255,60,170,.008);box-shadow:inset 0 0 14px 3px rgba(255,70,180,.32)}
#edgeGlow.glow-duality{border-color:#b76cff;background:rgba(155,70,255,.008);box-shadow:inset 0 0 14px 3px rgba(170,80,255,.32)}
#edgeGlow.glow-frenzy{border-color:#ff4444;background:rgba(255,45,45,.008);box-shadow:inset 0 0 15px 3px rgba(255,45,45,.34)}
#edgeGlow.glow-rush{border-color:#dfff3f;background:rgba(180,255,40,.009);box-shadow:inset 0 0 15px 3px rgba(135,255,45,.34)}
@keyframes edgePulse{0%,100%{opacity:.22;filter:brightness(.95)}50%{opacity:.38;filter:brightness(1.12)}}
.powerPulse{display:block!important;animation:powerPopupPulse 1s ease-in-out infinite!important;opacity:1!important}
@keyframes powerPopupPulse{0%,100%{transform:translate(-50%,-50%) scale(.96);filter:brightness(.95)}50%{transform:translate(-50%,-50%) scale(1.06);filter:brightness(1.18)}}

.overlay{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}.overlay.show{display:flex}.overlay .headline{width:78%;max-height:26%;object-fit:contain}.gameOverHeadline{width:82%;text-align:center;font-family:Impact,Arial Black,sans-serif;font-size:clamp(42px,10vw,72px);letter-spacing:4px;line-height:.95;color:#fff;text-shadow:0 3px 0 #6d0000,0 0 12px #ff2424,0 0 24px rgba(255,0,0,.7);transform:skew(-2deg)}.iconBtn{border:0;background:transparent;padding:0;width:72px;height:72px}.iconBtn img{width:100%;height:100%;object-fit:contain}.stats{width:82%;padding:14px;background:rgba(0,0,0,.78);border:2px solid rgba(255,255,255,.24);text-align:center;line-height:1.8}
#results{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),url('bg_results.png') center/cover no-repeat}

</style>

<body>
<div id="game">
<section id="home" class="screen active">
<img class="logo" src="logo_maggot_rush.png" alt="Maggot Rush">
<img id="startPopup" src="popup_push_to_start.png" alt="Push to Start">
<div class="homeControls">
<button id="rulesBtn" class="homeIconBtn" aria-label="Rules"><img src="icon_rules.png" alt="Rules"></button>
<button id="homeSoundBtn" class="homeIconBtn" aria-label="Sound"><img src="ui_sound_on.png" alt="Sound"></button>

</div>
</section>

</section>
<section id="play" class="screen">
<div id="edgeGlow"></div>
<div class="hud"><div class="top"><div class="hudPanel score"><div><b id="score">0</b></div></div><div id="stageTimer"><span id="timeLabel">TIME</span><span id="timeLeft">0:30</span></div><div id="bonusToast" aria-live="polite"></div><img id="pauseBtn" class="hudIcon" src="ui_pause.png" alt="Pause"><img id="soundBtn" class="hudIcon" src="ui_sound_on.png" alt="Sound"></div></div>
<div id="tray"><button class="pu empty" data-p="love" aria-label="Love Sick"><img src="powerup_love_sick.png" alt="Love Sick"></button><button class="pu empty" data-p="pollination" aria-label="Rotten Pollination"><img src="powerup_rotten_pollination.png" alt="Rotten Pollination"></button><button class="pu empty" data-p="magnet" aria-label="Maggot Magnet"><img src="powerup_maggot_magnet.png" alt="Maggot Magnet"></button><button class="pu empty" data-p="duality" aria-label="Filthy Duality"><img src="powerup_filthy_duality.png" alt="Filthy Duality"></button></div>
<div id="spawnRail"><div class="spawnRailFill"></div><img class="spawnRailFrame" src="hud_rot_meter_frame.png" alt=""></div><div id="modeTag" class="modeTag"></div><div id="arena"></div><img id="banner"><div id="powerStage"></div>
<div id="rot"><div id="rotBlocks" class="rotBlocks" aria-label="Rot Meter"><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span></div><img class="rotFrame" src="hud_rot_meter_frame.png" alt=""></div>
<div id="pauseOverlay" class="overlay"><img class="headline" src="popup_paused.png"><button id="resumeBtn" class="iconBtn"><img src="ui_resume.png"></button><button id="homeBtn" class="iconBtn"><img src="ui_home.png"></button></div>
<div id="results" class="overlay"><div id="resultHeadline" class="gameOverHeadline" role="img" aria-label="Game Over">GAME OVER</div><div id="resultStats" class="stats"></div><button id="retryBtn" class="iconBtn"><img src="ui_retry.png"></button><button id="resultHomeBtn" class="iconBtn"><img src="ui_home.png"></button></div>
</section></div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const home=$('#home'),play=$('#play'),arena=$('#arena'),banner=$('#banner'),powerStage=$('#powerStage'),edgeGlow=$('#edgeGlow');
const soundFiles=['ui_tap','ui_confirm','ui_back','ui_transition','fly_hit','fly_pop','fly_heavy_pop','maggot_split','maggot_pop','score_bonus','love_sick_activate','love_sick_wave','pollination_activate','pollination_freeze','magnet_activate','magnet_pull','duality_activate','duality_split'];
const sounds={};soundFiles.forEach(n=>{const a=new Audio('Audio/'+n+'.mp3');a.preload='none';if(n.includes('loop'))a.loop=true;sounds[n]=a});
let soundOn=true;function sfx(n,v=.55){if(!soundOn||!sounds[n])return;try{const a=sounds[n].cloneNode();a.volume=v;a.play().catch(()=>{})}catch{}}
let musicOn=true,currentMusic=null;
const musicFiles={menu:'Audio/music_menu.mp3',gameplay:'Audio/music_gameplay.mp3',frenzy:'Audio/music_rush.mp3',results:'Audio/music_results.mp3'};
function playMusic(key){if(currentMusic){currentMusic.pause();currentMusic=null}if(!musicOn||!musicFiles[key])return;const a=new Audio(musicFiles[key]);a.loop=true;a.volume=.38;a.play().catch(()=>{});currentMusic=a}
function stopMusic(){if(currentMusic){currentMusic.pause();currentMusic=null}}

const flyFrames={
basic:{flap:['fly_basic_flap_01.png','fly_basic_flap_02.png'],defeat:'fly_basic_defeat.png'},
fast:{flap:['fly_fast_flap_01.png','fly_fast_flap_02.png'],defeat:'fly_fast_defeat.png'},
carrier:{flap:['fly_carrier_flap_01.png','fly_carrier_flap_02.png'],defeat:'fly_carrier_defeat.png'},
heavy:{flap:['fly_heavy_flap_01.png','fly_heavy_flap_02.png'],defeat:'fly_heavy_defeat.png'},
boss:{flap:['fly_boss_flap_01.png','fly_boss_flap_02.png'],defeat:'fly_boss_defeat.png'}
};
const preload=[
...Object.values(flyFrames).flatMap(v=>[...v.flap,v.defeat]),
'maggot_crawl_01.png','maggot_crawl_02.png','fx_maggot_pop.png',
'powerup_love_sick.png','powerup_rotten_pollination.png','powerup_maggot_magnet.png','powerup_filthy_duality.png'
];preload.forEach(src=>{const i=new Image();i.src=src});
let state,actors=[],timeouts=[],raf=0,last=0,nextFly=0,nextMaggot=0,modeUntil=0,mode='normal';
let lastFlyRow=-1;
let pickup=null,powerPaused=false,freezeWorld=false,transitioning=false,bonusTimer=0,lastShownSecond=-1,magnetUntil=0,pollinationUntil=0,loveUntil=0,nextRushSpawn=0;
const MAX_FLIES_NORMAL=7,MAX_FLIES_FRENZY=10,MAX_MAGGOTS_NORMAL=7,MAX_MAGGOTS_RUSH=8,MAX_TOTAL_ACTORS=15;
const POWER_DROP_EVERY=30;
const STAGE_MS=30000;
const STAGE_CLEAR_PAUSE=2000;
const POWER_WEIGHTS=[['magnet',.40],['pollination',.30],['love',.20],['duality',.10]];
const POWER_META={
magnet:{icon:'powerup_maggot_magnet.png',popup:'popup_maggot_magnet.png',label:'MAGGOT MAGNET'},
pollination:{icon:'powerup_rotten_pollination.png',popup:'popup_rotten_pollination.png',label:'ROTTEN POLLINATION'},
love:{icon:'powerup_love_sick.png',popup:'popup_love_sick.png',label:'LOVE SICK'},
duality:{icon:'powerup_filthy_duality.png',popup:'popup_filthy_duality.png',label:'FILTHY DUALITY'}
};
const fresh=()=>({running:false,paused:false,score:0,hits:0,misses:0,kills:0,maggots:0,rot:0,stage:1,stageRemaining:STAGE_MS,inRedemption:false,rushRemaining:0,rushKills:0,rushBottomHits:0,rushTarget:10,rushBottomTarget:10,rushCount:0,cleanStreak:0,stage2FastUnlocked:false,introduced:{pollination:false,magnet:false,love:false,duality:false},powers:{love:0,pollination:0,magnet:0,duality:0},activePower:null});state=fresh();
function later(fn,ms){const id=setTimeout(fn,ms);timeouts.push(id);return id}function clearAll(){timeouts.forEach(clearTimeout);timeouts=[];cancelAnimationFrame(raf);actors.forEach(a=>a.el?.remove());actors=[];lastFlyRow=-1;if(pickup){pickup.remove();pickup=null}}
function screen(name){home.classList.toggle('active',name==='home');$('#rules').classList.toggle('active',name==='rules');play.classList.toggle('active',name==='play')}
function setEdgeGlow(kind=''){if(!edgeGlow)return;edgeGlow.className='';if(kind){edgeGlow.classList.add('active','glow-'+kind)}}
function restoreModeGlow(){if(state?.activePower){const map={magnet:'magnet',pollination:'pollination',love:'love',duality:'duality'};setEdgeGlow(map[state.activePower]||'');return}if(state?.inRedemption||mode==='maggotRush'){setEdgeGlow('rush')}else if(mode==='flyFrenzy'){setEdgeGlow('frenzy')}else setEdgeGlow('')}
function showPowerBanner(src,ms=3000){banner.src=src;banner.classList.remove('stageBanner','visible','showBanner','powerPulse');void banner.offsetWidth;banner.classList.add('powerPulse');later(()=>banner.classList.remove('powerPulse'),ms)}

let lastRotBlocks=0;function updateTimer(force=false){if(state.inRedemption){const el=$('#timeLeft'),box=$('#stageTimer');if(el)el.textContent='RUSH';if(box)box.classList.remove('danger');return}const remaining=state.stageRemaining;const sec=Math.max(0,Math.ceil((remaining||0)/1000));if(force||sec!==lastShownSecond){if(sec<=3&&sec>0&&sec!==lastShownSecond)sfx('ui_tap',.35);lastShownSecond=sec;const el=$('#timeLeft'),box=$('#stageTimer');if(el)el.textContent=`0:${String(sec).padStart(2,'0')}`;if(box)box.classList.toggle('danger',sec<=5&&sec>0)}}function updateRushBars(){const top=$('#spawnRail .spawnRailFill');if(top){if(state.inRedemption){top.style.background='#14a83b';top.style.transform=`scaleX(${Math.min(1,state.rushKills/state.rushTarget)})`}else{top.style.background='#030303';top.style.transform='scaleX(1)'}}$$('.rotBlock').forEach((b,i)=>{if(state.inRedemption){const filled=i<Math.min(10,Math.ceil((state.rushBottomHits/state.rushBottomTarget)*10));b.classList.toggle('filled',filled)} });}function hud(){$('#score').textContent=state.score;updateTimer();if(state.inRedemption){updateRushBars()}else{const filled=Math.max(0,Math.min(10,Math.floor(state.rot/10)));$$('.rotBlock').forEach((b,i)=>{const on=i<filled;b.classList.toggle('filled',on);if(on&&i>=lastRotBlocks){b.classList.remove('justFilled');void b.offsetWidth;b.classList.add('justFilled')}else if(!on)b.classList.remove('justFilled')});lastRotBlocks=filled;updateRushBars()}$$('.pu').forEach(b=>{const p=b.dataset.p,c=state.powers[p];b.classList.toggle('empty',!c);b.classList.toggle('disabled',!!state.activePower&&state.activePower!==p)})}
function showBonus(text,ms=950){const el=$('#bonusToast');if(!el)return;clearTimeout(bonusTimer);el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');bonusTimer=setTimeout(()=>{el.classList.remove('show');el.textContent=''},ms)}
function showBanner(src,ms=1000){banner.src=src;banner.classList.remove('stageBanner','visible','showBanner','powerPulse');void banner.offsetWidth;banner.classList.add('showBanner');later(()=>banner.classList.remove('showBanner'),ms)}
function showStageBanner(src,hold=4200){banner.src=src;banner.classList.remove('showBanner','stageBanner','visible','powerPulse');banner.classList.add('stageBanner');requestAnimationFrame(()=>banner.classList.add('visible'));later(()=>banner.classList.remove('visible'),hold);later(()=>banner.classList.remove('stageBanner'),hold+500)}
function addFx(x,y,src){const e=new Image();e.className='fx';e.src=src;e.style.left=x+'px';e.style.top=y+'px';arena.appendChild(e);later(()=>e.remove(),380)}
function countKind(kind){return actors.reduce((n,a)=>n+(!a.dead&&a.kind===kind?1:0),0)}
function findFlySpawnX(minDist=76){
const maxX=Math.max(1,arena.clientWidth-68);
const pollinating=state.activePower==='pollination'&&performance.now()<pollinationUntil;
const spacing=pollinating?Math.max(125,minDist):minDist;
const topLimit=pollinating?180:110;
const topFlies=actors.filter(a=>a.kind==='fly'&&!a.dead&&a.y<topLimit);
for(let i=0;i<(pollinating?28:16);i++){
const x=Math.random()*maxX;
if(topFlies.every(a=>Math.abs(a.x-x)>=spacing))return x;
}
return pollinating?null:Math.random()*maxX;
}
function loveSickPop(a){
if(!a||a.dead||state.activePower!=='love'||performance.now()>=loveUntil)return false;
a.dead=true;
actors=actors.filter(x=>x!==a);
const value=enemyBaseValue(a);
state.hits++;
if(a.kind==='fly')state.kills++;
state.score+=value;
a.el.style.pointerEvents='none';
a.el.src='fx_heart_burst.png';
a.el.style.width='60px';a.el.style.height='60px';
sfx(a.kind==='fly'?'fly_pop':'maggot_pop',.18);
later(()=>a.el?.remove(),240);
hud();

sfx('love_sick_wave',.24);
later(()=>{
if(state.activePower!=='love')return;
later(()=>{loveUntil=0},220);
if(sweep.isConnected){sweep.style.transition='opacity .55s ease';sweep.style.opacity='0'}
later(()=>powerOutro('LOVE SICK',650),550);
},8000);
}
function runDuality(){
const DURATION=10000,MAX_DUALITY=48;
setEdgeGlow('duality');
sfx('duality_activate',.25);
freezeWorld=true;powerPaused=true;
actors.forEach(x=>x.el.style.display='none');
if(pickup)pickup.style.display='none';
powerStage.innerHTML='';
let ended=false,nodeCount=0;
const nodes=new Set();
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function makeNode(xPct,yPct,size=16){
if(ended||nodeCount>=MAX_DUALITY)return;
nodeCount++;
const img=new Image();
img.className='powerActor dualityTarget';
img.src='duality_maggot_idle.png';
img.style.width=size+'%';
img.style.left=clamp(xPct,2,98-size)+'%';
img.style.top=clamp(yPct,15,78)+'%';
img.style.opacity='0';
img.style.transform='scale(.78)';
img.style.transition='opacity .2s ease,transform .24s ease';
powerStage.appendChild(img);nodes.add(img);
requestAnimationFrame(()=>{img.style.opacity='1';img.style.transform='scale(1)'});
img.addEventListener('pointerdown',ev=>{
ev.preventDefault();ev.stopPropagation();
if(ended||img.dataset.splitting==='1')return;
img.dataset.splitting='1';sfx('duality_split',.18);
const frames=['duality_split_01.png','duality_split_02.png','duality_split_03.png','duality_split_04.png'];
frames.forEach((src,i)=>later(()=>{if(!ended&&img.isConnected)img.src=src},i*105));
later(()=>{
if(ended||!img.isConnected)return;
const left=parseFloat(img.style.left)||40,top=parseFloat(img.style.top)||42,w=parseFloat(img.style.width)||size;
img.remove();nodes.delete(img);
const childSize=Math.max(7,w*.82);
const offset=Math.max(4,childSize*.42);
makeNode(left-offset,top+1,childSize);
makeNode(left+offset,top+1,childSize);
},470);
});
}
makeNode(42,40,18);
let seconds=10;
function countdown(){
if(ended)return;
seconds--;
if(seconds>=0)later(countdown,1000);
}
countdown();
later(()=>{
if(ended)return;ended=true;
const live=[...nodes].filter(n=>n.isConnected);
live.forEach((img,i)=>{
img.style.pointerEvents='none';
later(()=>{if(img.isConnected)img.src='duality_pop_01.png'},Math.min(i*12,180));
later(()=>{if(img.isConnected)img.src='duality_pop_02.png'},220+Math.min(i*12,180));
later(()=>img.remove(),520+Math.min(i*12,180));
});
sfx('score_bonus',.25);
state.score+=1000;showBonus('+1000 DUALITY',1400);hud();
later(()=>{
powerStage.innerHTML='';
state.activePower=null;
powerPaused=false;freezeWorld=false;
restoreModeGlow();
hud();
completeInfestation();
},760);
},DURATION);
}
function loop(t){
if(!state.running)return;
if(!last)last=t;
const dt=Math.min(.033,(t-last)/1000);last=t;
if(!state.paused&&!powerPaused&&!freezeWorld){
if(state.inRedemption){
updateTimer();
if(t>=nextRushSpawn&&countKind('maggot')<7){addMaggot(null,-58,88,'rush');nextRushSpawn=t+420}
}else{
state.stageRemaining=Math.max(0,state.stageRemaining-dt*1000);updateTimer();
if(state.stageRemaining<=0){completeInfestation();raf=requestAnimationFrame(loop);return}
if(modeUntil&&t>=modeUntil)endMode();
const plan=currentWavePlan();
const magnetClosing=state.activePower==='magnet'&&t<magnetUntil&&(magnetUntil-t)<=1000;if(t>=nextFly&&mode!=='maggotRush'&&!magnetClosing){addFly(chooseFly(plan.types||{basic:1}));const pollinating=state.activePower==='pollination'&&t<pollinationUntil;const normalDelay=mode==='flyFrenzy'?Math.max(450,Math.min(550,plan.flyMs)):plan.flyMs;nextFly=t+(pollinating?Math.max(1100,normalDelay*1.8):normalDelay)}
if(t>=nextMaggot&&mode!=='flyFrenzy'&&!magnetClosing){addMaggot(null,null,88);nextMaggot=t+plan.maggotMs}
}
for(const a of [...actors]){
if(state.activePower==='love'&&t<loveUntil&&!a.dead){const elapsed=Math.max(0,8000-(loveUntil-t));const sweepX=-arena.clientWidth*.76+(elapsed/8000)*(arena.clientWidth*1.8);if((a.x+(a.kind==='fly'?34:28))<=sweepX){loveSickPop(a);continue}}
if(state.activePower==='pollination'&&t<pollinationUntil&&a.freezeAt&&t>=a.freezeAt)stunForPollination(a,1100);
if(a.dead||t<(a.frozenUntil||0))continue;
if(state.activePower==='magnet'&&t<magnetUntil&&t-(a.spawnedAt||0)>=1000){
const targetX=arena.clientWidth*.5-(a.kind==='fly'?34:28),targetY=arena.clientHeight-(a.kind==='fly'?92:82);
const pull=Math.min(1,dt*2.35);
a.x+=(targetX-a.x)*pull;a.y+=(targetY-a.y)*pull;
a.el.style.pointerEvents='none';
if(a.kind==='fly'&&t-a.lastFrame>170){a.lastFrame=t;a.frame=(a.frame+1)%2;a.el.src=a.frames[a.frame]}
else if(a.kind==='maggot'&&t-a.lastFrame>180){a.lastFrame=t;a.frame=(a.frame+1)%2;a.el.src=`maggot_crawl_0${a.frame+1}.png`}
a.el.style.transform=`translate3d(${a.x}px,${a.y}px,0)`;
continue;
}
if(a.kind==='fly'){
a.y+=a.vy*dt;
a.x+=a.vx*dt+Math.sin(t/320+a.phase)*5*dt;
if(a.x<0||a.x>arena.clientWidth-68){a.vx*=-1;a.x=Math.max(0,Math.min(arena.clientWidth-68,a.x))}
if(t-a.lastFrame>170){a.lastFrame=t;a.frame=(a.frame+1)%2;a.el.src=a.frames[a.frame]}
if(a.y>=arena.clientHeight-68){a.y=arena.clientHeight-68;a.el.style.transform=`translate3d(${a.x}px,${a.y}px,0)`;flyEscaped(a);continue}
}else{
a.y+=a.vy*dt;
if(t-a.lastFrame>180){a.lastFrame=t;a.frame=(a.frame+1)%2;a.el.src=`maggot_crawl_0${a.frame+1}.png`}
if(a.y>=arena.clientHeight-58){a.y=arena.clientHeight-58;a.el.style.transform=`translate3d(${a.x}px,${a.y}px,0)`;maggotLanded(a);continue}
}
a.el.style.transform=`translate3d(${a.x}px,${a.y}px,0)`
}
}
raf=requestAnimationFrame(loop)
}
function reset(){playMusic('gameplay');clearAll();setEdgeGlow('');lastRotBlocks=0;lastShownSecond=-1;magnetUntil=0;pollinationUntil=0;loveUntil=0;nextRushSpawn=0;powerPaused=false;freezeWorld=false;transitioning=false;pickup=null;arena.innerHTML='';powerStage.innerHTML='';state=fresh();state.running=true;last=0;lastFlyRow=-1;mode='normal';modeUntil=0;$('#bonusToast').textContent='';$('#bonusToast').classList.remove('show');$('#results').classList.remove('show');$('#results').style.backgroundImage="linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.58)),url('bg_game_over.png')";$('#resultHeadline').textContent='GAME OVER';$('#pauseOverlay').classList.remove('show');$('#modeTag').classList.remove('rushVisible');hud();applyWave(1);raf=requestAnimationFrame(loop);scheduleStage()}
function scheduleStage(){state.stageRemaining=STAGE_MS;lastShownSecond=-1;updateTimer(true)}
function endGame(){if(!state.running)return;state.running=false;state.paused=true;setEdgeGlow('');const acc=state.hits+state.misses?Math.round(state.hits/(state.hits+state.misses)*100):100;$('#resultHeadline').textContent='GAME OVER';$('#resultHeadline').setAttribute('aria-label','Game Over');$('#results').style.backgroundImage="linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.58)),url('bg_game_over.png')";$('#resultStats').innerHTML=`<strong>${state.score}</strong><br>SCORE<br>${state.kills} FLY KILLS • ${state.maggots} MAGGOTS<br>${acc}% ACCURACY`;$('#results').classList.add('show');playMusic('results');sfx('ui_transition')}
function pause(force){if(!state.running)return;state.paused=force===undefined?!state.paused:force;$('#pauseOverlay').classList.toggle('show',state.paused);$('#pauseBtn').src=state.paused?'ui_resume.png':'ui_pause.png';sfx('ui_tap',.2)}
const startGame=()=>{screen('play');reset()};
function goHome(){
setEdgeGlow('');
state.running=false;state.paused=false;clearAll();powerPaused=false;freezeWorld=false;transitioning=false;pickup=null;mode='normal';modeUntil=0;last=0;lastRotBlocks=0;lastFlyRow=-1;magnetUntil=0;pollinationUntil=0;loveUntil=0;nextRushSpawn=0;clearTimeout(bonusTimer);
arena.innerHTML='';powerStage.innerHTML='';banner.classList.remove('showBanner');$('#modeTag').classList.remove('rushVisible');$('#results').classList.remove('show');$('#pauseOverlay').classList.remove('show');$('#pauseBtn').src='ui_pause.png';
screen('home');updateAudioIcons();if(musicOn)playMusic('menu');else stopMusic();
}
function bindPress(el,fn){if(!el)return;el.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();fn(ev)},{passive:false})}
bindPress($('#startPopup'),startGame);
bindPress($('#rulesBtn'),()=>{screen('rules');sfx('ui_tap',.2)});
bindPress($('#rulesBackBtn'),()=>{screen('home');sfx('ui_back',.22)});
function updateAudioIcons(){
const s=soundOn?'ui_sound_on.png':'ui_sound_off.png',m=musicOn?'ui_music_on.png':'ui_music_off.png';
$('#soundBtn').src=s;const hs=$('#homeSoundBtn img'),hm=$('#homeMusicBtn img');if(hs){hs.src=s;hs.alt=soundOn?'Sound on':'Sound off'}if(hm){hm.src=m;hm.alt=musicOn?'Music on':'Music off'}
$('#homeSoundBtn').setAttribute('aria-label',soundOn?'Sound on':'Sound off');$('#homeMusicBtn').setAttribute('aria-label',musicOn?'Music on':'Music off');
}
bindPress($('#homeSoundBtn'),()=>{soundOn=!soundOn;updateAudioIcons()});
bindPress($('#homeMusicBtn'),()=>{musicOn=!musicOn;updateAudioIcons();requestAnimationFrame(()=>{if(!musicOn)stopMusic();else playMusic(home.classList.contains('active')?'menu':'gameplay')})});
bindPress($('#pauseBtn'),()=>pause());bindPress($('#resumeBtn'),()=>pause(false));bindPress($('#homeBtn'),goHome);bindPress($('#retryBtn'),reset);bindPress($('#resultHomeBtn'),goHome);bindPress($('#soundBtn'),()=>{soundOn=!soundOn;updateAudioIcons()});$$('.pu').forEach(b=>bindPress(b,()=>usePower(b.dataset.p)));window.addEventListener('blur',()=>state.running&&pause(true));
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('error',e=>{if(e.target?.tagName==='IMG'){console.error('Missing graphic:',e.target.getAttribute('src'));e.target.style.visibility='hidden'}},true);

updateAudioIcons();
})();
</script>
