<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rotted Threadz: Maggot Rush</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:grid;place-items:center}
#game{position:relative;width:min(100vw,562.5px);height:min(100dvh,1000px);aspect-ratio:9/16;overflow:hidden;background:#050505 center/cover no-repeat;touch-action:none;user-select:none}
.screen{position:absolute;inset:0;display:none}.screen.active{display:block}
#home{background:url('bg_home.png') center/cover no-repeat}
.logo{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:82%;height:auto;object-fit:contain}








#rules{background:#050505 url('bg_rules.png') center/cover no-repeat;z-index:8}
.rulesBack{position:absolute;left:5%;top:max(16px,env(safe-area-inset-top));width:54px;height:54px;border:0;background:transparent;padding:0;cursor:pointer;z-index:9}
.rulesBack img{width:100%;height:100%;object-fit:contain}
.rulesFallback{position:absolute;left:8%;right:8%;top:17%;bottom:9%;padding:22px;background:rgba(0,0,0,.78);border:2px solid rgba(255,255,255,.22);overflow:auto;text-align:left;line-height:1.45}
.rulesFallback h2{margin:0 0 12px;font-size:24px;letter-spacing:2px}.rulesFallback b{color:#d4ff72}

#home .logo{position:absolute;left:50%;top:15%;transform:translateX(-50%);width:92%;max-width:520px;max-height:39%;object-fit:contain;filter:drop-shadow(0 10px 14px #000);z-index:3}
#startPopup{position:absolute;left:50%;top:51%;transform:translateX(-50%);width:64%;max-width:360px;height:auto;object-fit:contain;cursor:pointer;z-index:4;filter:drop-shadow(0 7px 10px rgba(0,0,0,.72));animation:startPulse 1.05s ease-in-out infinite}
@keyframes startPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07);filter:brightness(1.14) drop-shadow(0 8px 12px rgba(0,0,0,.8))}}
.homeControls{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:88%;display:flex;justify-content:center;align-items:center;gap:8%;z-index:6}
.homeIconBtn{width:82px;height:82px;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation}
.homeIconBtn img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(0,0,0,.72))}
.homeIconBtn:active{transform:scale(.94)}
#rules{background:#050505 url('bg_rules.png') center/cover no-repeat;z-index:8}
.rulesBack{position:absolute;left:5%;top:max(16px,env(safe-area-inset-top));width:64px;height:64px;border:0;background:transparent;padding:0;cursor:pointer;z-index:9}
.rulesBack img{width:100%;height:100%;object-fit:contain}
.rulesFallback{display:none}

#play{background:url('bg_gameplay_01.png') center/cover no-repeat}
.hud{position:absolute;z-index:30;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;pointer-events:none}
.top{display:flex;gap:8px;align-items:flex-start;min-height:58px}.hudPanel{position:relative;width:40%;height:58px;background:center/100% 100% no-repeat;display:grid;place-items:center;text-align:center}.hudPanel.score{background-image:url('hud_score_panel.png')}.hudPanel b{font-size:20px;line-height:1}.hudPanel small{font-size:8px;letter-spacing:1px;opacity:.8}.hudPanel>div{padding-top:3px}
#bonusToast{align-self:center;max-width:34%;min-height:20px;font-size:11px;font-weight:700;letter-spacing:.7px;text-align:left;text-shadow:0 2px 3px #000;opacity:0;transform:translateY(-3px);transition:opacity .12s linear,transform .12s linear;pointer-events:none}#bonusToast.show{opacity:1;transform:translateY(0)}
.hudIcon{width:38px;height:38px;object-fit:contain;pointer-events:auto;cursor:pointer}.top .hudIcon:first-of-type{margin-left:auto}
#tray{position:absolute;z-index:28;top:max(66px,calc(env(safe-area-inset-top) + 58px));left:50%;transform:translateX(-50%);width:78%;height:auto;aspect-ratio:1639/522;background:url('hud_powerup_tray.png') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;gap:2.5%;pointer-events:none}.pu{position:relative;width:20%;aspect-ratio:1;border:0;background:transparent;padding:0;touch-action:manipulation;pointer-events:auto}.pu img{width:100%;height:100%;object-fit:contain}.pu.empty img{visibility:hidden}.pu.disabled:not(.empty){filter:grayscale(1) brightness(.45)}.charge{display:none}
#rot{position:absolute;z-index:28;left:4%;right:4%;bottom:max(8px,env(safe-area-inset-bottom));height:34px;pointer-events:none}.rotFrame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:2;pointer-events:none}.rotBlocks{position:absolute;left:4.5%;right:4.5%;top:27%;bottom:27%;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;z-index:1}.rotBlock{background:rgba(12,8,8,.9);border:1px solid rgba(140,0,0,.32);transition:filter .08s linear,transform .08s linear}.rotBlock.filled{background:#b20d16;border-color:#ff3434;box-shadow:inset 0 0 0 1px rgba(255,0,0,.18)}.rotBlock.justFilled{animation:rotBlockPop .22s steps(2,end)}@keyframes rotBlockPop{50%{filter:brightness(2);transform:scaleY(1.3)}}
#arena{position:absolute;top:clamp(170px,37vw,210px);left:0;right:0;bottom:58px;overflow:hidden}
.sprite{position:absolute;object-fit:contain;touch-action:none;will-change:transform;z-index:8}.powerPickup{position:absolute;width:66px;height:66px;object-fit:contain;z-index:24;cursor:pointer;filter:drop-shadow(0 0 8px rgba(255,255,255,.55));animation:pickupPulse .75s ease-in-out infinite alternate}@keyframes pickupPulse{to{transform:scale(1.12);filter:drop-shadow(0 0 13px rgba(255,255,255,.9))}}.powerActor{z-index:38}.maggotFalling{filter:drop-shadow(0 5px 4px rgba(0,0,0,.55))}.fly{width:68px;height:68px}.maggot{width:56px;height:56px}.fx{position:absolute;width:80px;height:80px;object-fit:contain;pointer-events:none;z-index:12;animation:pop .35s ease-out forwards}@keyframes pop{to{transform:scale(1.4);opacity:0}}
#banner{display:none;position:absolute;z-index:45;left:50%;top:35%;transform:translate(-50%,-50%);width:86%;object-fit:contain;pointer-events:none}.showBanner{display:block!important;animation:banner .9s ease both}@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(.98)}}
#powerStage{position:absolute;inset:0;z-index:35;pointer-events:none}.powerActor{position:absolute;object-fit:contain}.dualityTarget{pointer-events:auto}
.overlay{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}.overlay.show{display:flex}.overlay .headline{width:78%;max-height:26%;object-fit:contain}.iconBtn{border:0;background:transparent;padding:0;width:72px;height:72px}.iconBtn img{width:100%;height:100%;object-fit:contain}.stats{width:82%;padding:14px;background:rgba(0,0,0,.78);border:2px solid rgba(255,255,255,.24);text-align:center;line-height:1.8}
#results{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),url('bg_results.png') center/cover no-repeat}
.modeTag{position:absolute;top:148px;left:50%;transform:translateX(-50%);z-index:19;font-size:10px;letter-spacing:2px;opacity:.75}
</style>
</head>
<body>
<div id="game">
<section id="home" class="screen active">
<img class="logo" src="logo_maggot_rush.png" alt="Maggot Rush">
<img id="startPopup" src="popup_push_to_start.png" alt="Push to Start">
<div class="homeControls">
<button id="rulesBtn" class="homeIconBtn" aria-label="Rules"><img src="icon_rules.png" alt="Rules"></button>
<button id="homeSoundBtn" class="homeIconBtn" aria-label="Sound"><img src="ui_sound_on.png" alt="Sound"></button>
<button id="homeMusicBtn" class="homeIconBtn" aria-label="Music"><img src="ui_music_on.png" alt="Music"></button>
</div>
</section>
<section id="rules" class="screen">
<button id="rulesBackBtn" class="rulesBack"><img src="ui_back.png" alt="Back"></button>

</section>
<section id="play" class="screen">
<div class="hud"><div class="top"><div class="hudPanel score"><div><b id="score">0</b><br><small>SCORE</small></div></div><div id="bonusToast" aria-live="polite"></div><img id="pauseBtn" class="hudIcon" src="ui_pause.png" alt="Pause"><img id="soundBtn" class="hudIcon" src="ui_sound_on.png" alt="Sound"></div></div>
<div id="tray"><button class="pu empty" data-p="love" aria-label="Love Sick"><img src="powerup_love_sick.png" alt="Love Sick"></button><button class="pu empty" data-p="pollination" aria-label="Rotten Pollination"><img src="powerup_rotten_pollination.png" alt="Rotten Pollination"></button><button class="pu empty" data-p="magnet" aria-label="Maggot Magnet"><img src="powerup_maggot_magnet.png" alt="Maggot Magnet"></button><button class="pu empty" data-p="duality" aria-label="Filthy Duality"><img src="powerup_filthy_duality.png" alt="Filthy Duality"></button></div>
<div id="modeTag" class="modeTag"></div><div id="arena"></div><img id="banner"><div id="powerStage"></div>
<div id="rot"><div id="rotBlocks" class="rotBlocks" aria-label="Rot Meter"><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span><span class="rotBlock"></span></div><img class="rotFrame" src="hud_rot_meter_frame.png" alt=""></div>
<div id="pauseOverlay" class="overlay"><img class="headline" src="popup_paused.png"><button id="resumeBtn" class="iconBtn"><img src="ui_resume.png"></button><button id="homeBtn" class="iconBtn"><img src="ui_home.png"></button></div>
<div id="results" class="overlay"><img id="resultHeadline" class="headline" src="popup_stage_failed.png" alt="Game Over"><div id="resultStats" class="stats"></div><button id="retryBtn" class="iconBtn"><img src="ui_retry.png"></button><button id="resultHomeBtn" class="iconBtn"><img src="ui_home.png"></button></div>
</section></div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const home=$('#home'),play=$('#play'),arena=$('#arena'),banner=$('#banner'),powerStage=$('#powerStage');
const soundFiles=['ui_tap','ui_confirm','ui_back','ui_transition','fly_hit','fly_pop','fly_heavy_pop','maggot_split','maggot_pop','score_bonus','love_sick_activate','love_sick_wave','pollination_activate','pollination_freeze','magnet_activate','magnet_pull','duality_activate','duality_split'];
const sounds={};soundFiles.forEach(n=>{const a=new Audio('Audio/'+n+'.mp3');a.preload='none';if(n.includes('loop'))a.loop=true;sounds[n]=a});
let soundOn=true;function sfx(n,v=.55){if(!soundOn||!sounds[n])return;try{const a=sounds[n].cloneNode();a.volume=v;a.play().catch(()=>{})}catch{}}
let musicOn=true,currentMusic=null;
const musicFiles={menu:'Audio/music_menu.mp3',gameplay:'Audio/music_gameplay.mp3',frenzy:'Audio/music_rush.mp3',results:'Audio/music_results.mp3'};
function playMusic(key){if(currentMusic){currentMusic.pause();currentMusic=null}if(!musicOn||!musicFiles[key])return;const a=new Audio(musicFiles[key]);a.loop=true;a.volume=.38;a.play().catch(()=>{});currentMusic=a}
function stopMusic(){if(currentMusic){currentMusic.pause();currentMusic=null}}

const flyFrames={
basic:{flap:['fly_basic_flap_01.png','fly_basic_flap_02.png'],defeat:'fly_basic_defeat.png'},
fast:{flap:['fly_fast_flap_01.png','fly_fast_flap_02.png'],defeat:'fly_fast_defeat.png'},
carrier:{flap:['fly_carrier_flap_01.png','fly_carrier_flap_02.png'],defeat:'fly_carrier_defeat.png'},
heavy:{flap:['fly_heavy_flap_01.png','fly_heavy_flap_02.png'],defeat:'fly_heavy_defeat.png'},
boss:{flap:['fly_boss_flap_01.png','fly_boss_flap_02.png'],defeat:'fly_boss_defeat.png'}
};
const preload=[
...Object.values(flyFrames).flatMap(v=>[...v.flap,v.defeat]),
'maggot_crawl_01.png','maggot_crawl_02.png','fx_maggot_pop.png',
'powerup_love_sick.png','powerup_rotten_pollination.png','powerup_maggot_magnet.png','powerup_filthy_duality.png'
];preload.forEach(src=>{const i=new Image();i.src=src});
let state,actors=[],timeouts=[],raf=0,last=0,nextFly=0,nextMaggot=0,modeUntil=0,mode='normal';
let lastFlyRow=-1;
let pickup=null,powerPaused=false,freezeWorld=false,transitioning=false,bonusTimer=0;
const MAX_FLIES_NORMAL=7,MAX_FLIES_FRENZY=10,MAX_MAGGOTS_NORMAL=7,MAX_MAGGOTS_RUSH=10,MAX_TOTAL_ACTORS=15;
const POWER_DROP_EVERY=30;
const STAGE_MS=25000;
const STAGE_CLEAR_PAUSE=5000;
const POWER_WEIGHTS=[['magnet',.40],['pollination',.30],['love',.20],['duality',.10]];
const POWER_META={
magnet:{icon:'powerup_maggot_magnet.png',popup:'popup_maggot_magnet.png',label:'MAGGOT MAGNET'},
pollination:{icon:'powerup_rotten_pollination.png',popup:'popup_rotten_pollination.png',label:'ROTTEN POLLINATION'},
love:{icon:'powerup_love_sick.png',popup:'popup_love_sick.png',label:'LOVE SICK'},
duality:{icon:'powerup_filthy_duality.png',popup:'popup_filthy_duality.png',label:'FILTHY DUALITY'}
};
const fresh=()=>({running:false,paused:false,score:0,hits:0,misses:0,kills:0,maggots:0,rot:0,stage:1,powers:{love:0,pollination:0,magnet:0,duality:0},activePower:null});state=fresh();
function later(fn,ms){const id=setTimeout(fn,ms);timeouts.push(id);return id}function clearAll(){timeouts.forEach(clearTimeout);timeouts=[];cancelAnimationFrame(raf);actors.forEach(a=>a.el?.remove());actors=[];lastFlyRow=-1;if(pickup){pickup.remove();pickup=null}}
function screen(name){home.classList.toggle('active',name==='home');$('#rules').classList.toggle('active',name==='rules');play.classList.toggle('active',name==='play')}
let lastRotBlocks=0;function hud(){$('#score').textContent=state.score;const filled=Math.max(0,Math.min(10,Math.floor(state.rot/10)));$$('.rotBlock').forEach((b,i)=>{const on=i<filled;b.classList.toggle('filled',on);if(on&&i>=lastRotBlocks){b.classList.remove('justFilled');void b.offsetWidth;b.classList.add('justFilled')}else if(!on)b.classList.remove('justFilled')});lastRotBlocks=filled;$$('.pu').forEach(b=>{const p=b.dataset.p,c=state.powers[p];b.classList.toggle('empty',!c);b.classList.toggle('disabled',!!state.activePower&&state.activePower!==p)})}
function showBonus(text,ms=950){const el=$('#bonusToast');if(!el)return;clearTimeout(bonusTimer);el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');bonusTimer=setTimeout(()=>{el.classList.remove('show');el.textContent=''},ms)}
function showBanner(src,ms=1000){banner.src=src;banner.classList.remove('showBanner');void banner.offsetWidth;banner.classList.add('showBanner');later(()=>banner.classList.remove('showBanner'),ms)}
function addFx(x,y,src){const e=new Image();e.className='fx';e.src=src;e.style.left=x+'px';e.style.top=y+'px';arena.appendChild(e);later(()=>e.remove(),380)}
function countKind(kind){return actors.reduce((n,a)=>n+(!a.dead&&a.kind===kind?1:0),0)}
function flyRowCount(){return Math.max(3,Math.min(5,Math.floor(arena.clientHeight/125)))}
function flyRowY(row){const rows=flyRowCount();const top=24,bottom=Math.max(120,arena.clientHeight*.46);const spacing=(bottom-top)/Math.max(1,rows-1);return top+row*spacing}
function chooseFlyRow(){const rows=[...Array(flyRowCount()).keys()];const occupied=new Set(actors.filter(a=>a.kind==='fly'&&!a.dead&&Number.isInteger(a.row)).map(a=>a.row));let candidates=rows.filter(r=>r!==lastFlyRow&&!occupied.has(r));if(!candidates.length)candidates=rows.filter(r=>r!==lastFlyRow);if(!candidates.length)candidates=rows;const row=candidates[Math.floor(Math.random()*candidates.length)]??0;lastFlyRow=row;return row}
function addFly(type='basic'){
if(!state.running||state.paused||powerPaused)return;
const flyCap=mode==='flyFrenzy'?MAX_FLIES_FRENZY:MAX_FLIES_NORMAL;
if(countKind('fly')>=flyCap||actors.length>=MAX_TOTAL_ACTORS)return;
const spec=flyFrames[type]||flyFrames.basic,frames=spec.flap,e=new Image();e.className='sprite fly';e.src=frames[0];arena.appendChild(e);
const hp=type==='boss'?4:type==='heavy'?2:1;
const speed=type==='fast'?145:type==='boss'?48:type==='heavy'?55:type==='carrier'?88:82;
const life=type==='fast'?3000:type==='boss'?8000:type==='heavy'?5600:4400;
const row=chooseFlyRow(),baseY=flyRowY(row),phase=Math.random()*Math.PI*2;
const a={kind:'fly',type,el:e,frames,defeat:spec.defeat,frame:0,lastFrame:0,row,baseY,phase,
x:Math.random()*Math.max(1,arena.clientWidth-70),y:baseY,
vx:(Math.random()<.5?-1:1)*speed,hp,expires:performance.now()+life};
actors.push(a);
e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(a.dead||state.paused||(powerPaused&&!freezeWorld))return;a.hp--;if(a.hp<=0)killFly(a)});
}
function killFly(a){
if(a.dead)return;
a.dead=true;
actors=actors.filter(x=>x!==a);
state.kills++;state.hits++;
state.score+=(a.type==='boss'?10:a.type==='heavy'?4:a.type==='carrier'?3:a.type==='fast'?2:1);
a.el.src=a.defeat;a.el.style.pointerEvents='none';
later(()=>a.el.remove(),180);
sfx(a.type==='heavy'||a.type==='boss'?'fly_heavy_pop':'fly_pop',.30);

if(a.type==='carrier')later(()=>addMaggot(a.x+6,a.y+24,90,'carrier'),70);
if(state.kills>0&&state.kills%POWER_DROP_EVERY===0)spawnPowerPickup();
hud();
}
function maggotDistanceOK(x,y,minDist=75){return !actors.some(o=>o.kind==='maggot'&&!o.dead&&Math.abs(o.x-x)<minDist&&Math.abs(o.y-y)<90)}
function findMaggotX(preferredX=null,minDist=75){const maxX=Math.max(1,arena.clientWidth-56);for(let i=0;i<18;i++){const x=preferredX==null?Math.random()*maxX:Math.max(0,Math.min(maxX,preferredX+(Math.random()*120-60)));if(maggotDistanceOK(x,-55,minDist))return x}return Math.random()*maxX}
function addMaggot(x=null,y=null,minDist=75,source='sky'){if(!state.running||state.paused||powerPaused||transitioning)return;const cap=mode==='maggotRush'?MAX_MAGGOTS_RUSH:MAX_MAGGOTS_NORMAL;if(countKind('maggot')>=cap||actors.length>=MAX_TOTAL_ACTORS)return;const startX=findMaggotX(x,minDist),startY=y==null?-58:Math.max(-58,Math.min(arena.clientHeight*.7,y));const e=new Image();e.className='sprite maggot maggotFalling';e.src='maggot_crawl_01.png';arena.appendChild(e);const a={kind:'maggot',el:e,x:startX,y:startY,vy:source==='carrier'?210+Math.random()*55:245+Math.random()*70,frame:0,lastFrame:0,source};actors.push(a);state.maggots++;e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(a.dead||state.paused||powerPaused)return;a.dead=true;e.remove();actors=actors.filter(x=>x!==a);state.score+=1;state.hits++;addFx(a.x,a.y,'fx_maggot_pop.png');sfx('maggot_pop',.32);hud()})}
function maggotLanded(a){if(a.dead)return;a.dead=true;a.el.remove();actors=actors.filter(x=>x!==a);state.rot=Math.min(100,state.rot+10);sfx('maggot_split',.28);hud();if(state.rot>=100){endGame();return}for(let i=0;i<3;i++)later(()=>{if(state.running&&!state.paused&&!transitioning)addMaggot(null,-58,70,'sky')},160+i*125)}
function unlockedPowers(stage=state.stage){if(stage<=1)return['magnet'];if(stage===2)return['pollination'];if(stage===3)return['love'];if(stage===4)return['duality'];return['magnet','pollination','love','duality']}
function weightedPower(pool=unlockedPowers()){const allowed=new Set(pool);const weights=POWER_WEIGHTS.filter(([p])=>allowed.has(p));const total=weights.reduce((n,[,w])=>n+w,0);let r=Math.random()*total,sum=0;for(const [p,w] of weights){sum+=w;if(r<=sum)return p}return weights[0]?.[0]||'magnet'}
function spawnPowerPickup(){
if(pickup||!state.running||state.paused||powerPaused||transitioning)return;
const pool=unlockedPowers();const available=pool.filter(p=>state.powers[p]<1);
if(!available.length)return;
let p=weightedPower(available);
const meta=POWER_META[p],e=new Image();e.className='powerPickup';e.src=meta.icon;e.dataset.power=p;
const x=18+Math.random()*Math.max(1,arena.clientWidth-102),y=45+Math.random()*Math.max(1,arena.clientHeight-165);
e.style.left=x+'px';e.style.top=y+'px';arena.appendChild(e);pickup=e;
const expire=later(()=>{if(pickup===e){e.remove();pickup=null}},6500);
e.addEventListener('pointerdown',ev=>{
ev.preventDefault();if(state.paused||powerPaused||pickup!==e)return;
clearTimeout(expire);state.powers[p]=1;e.remove();pickup=null;hud();
showBanner(meta.popup,1100);showBonus(meta.label+' READY');sfx('score_bonus',.28);
});
}
function setGameplayBackground(stage=state.stage){const src=stage>=7?'bg_gameplay_03.png':stage>=4?'bg_gameplay_02.png':'bg_gameplay_01.png';play.style.backgroundImage=`url('${src}')`}
function beginFlyFrenzy(fullWave=false){playMusic('frenzy');mode='flyFrenzy';modeUntil=fullWave?0:performance.now()+7000;$('#modeTag').textContent='FLY FRENZY';showBanner('popup_fly_frenzy.png');play.style.backgroundImage="url('bg_fly_rush.png')";for(let i=0;i<6;i++)later(()=>addFly(i%3===0?'fast':'basic'),i*220)}
function beginMaggotRush(fullWave=false){mode='maggotRush';modeUntil=fullWave?0:performance.now()+7000;$('#modeTag').textContent='MAGGOT RUSH';showBanner('popup_maggot_rush.png');for(let i=0;i<6;i++)later(()=>{if(countKind('maggot')<MAX_MAGGOTS_RUSH)addMaggot(null,null,110)},i*420)}
function endMode(){playMusic('gameplay');mode='normal';modeUntil=0;$('#modeTag').textContent='';setGameplayBackground()}
const wavePlans={
1:{flyMs:660,maggotMs:12000,types:{basic:1},maggotDelay:13500},
2:{flyMs:610,maggotMs:8200,types:{basic:.72,fast:.28}},

4:{flyMs:610,maggotMs:6500,types:{basic:.53,fast:.27,carrier:.20}},

6:{flyMs:900,maggotMs:720,types:{basic:.45,fast:.25,carrier:.20,heavy:.10},mode:'maggotRush'},
7:{flyMs:500,maggotMs:5200,types:{basic:.34,fast:.29,carrier:.23,heavy:.14}},
8:{flyMs:445,maggotMs:4800,types:{basic:.36,fast:.32,carrier:.20,heavy:.12}},
9:{flyMs:410,maggotMs:4500,types:{basic:.42,fast:.32,carrier:.17,heavy:.09}},
10:{flyMs:390,maggotMs:4200,types:{basic:.32,fast:.31,carrier:.23,heavy:.14}}
};
function currentWavePlan(){if(state.stage<=10)return wavePlans[state.stage];const cycle=[7,8,9,10][(state.stage-11)%4],base=wavePlans[cycle],tier=1+Math.floor((state.stage-11)/4)*.08;return{...base,flyMs:Math.max(220,base.flyMs/tier),maggotMs:Math.max(850,base.maggotMs/tier),mode:state.stage%6===0?'maggotRush':state.stage%5===0?'flyFrenzy':undefined}}
function chooseFly(types){const r=Math.random();let sum=0;for(const [type,w] of Object.entries(types)){sum+=w;if(r<=sum)return type}return'basic'}
function clearPlayfield(){actors.forEach(a=>a.dead=true);actors=[];if(pickup){pickup.remove();pickup=null}arena.innerHTML='';powerStage.innerHTML=''}
function applyWave(stage=state.stage){if(mode!=='normal')endMode();const p=currentWavePlan();$('#modeTag').textContent='';setGameplayBackground(stage);if(p.mode==='flyFrenzy')beginFlyFrenzy(true);else if(p.mode==='maggotRush')beginMaggotRush(true);else mode='normal';nextFly=performance.now()+180;nextMaggot=performance.now()+(p.maggotDelay||p.maggotMs)}
function completeInfestation(){if(!state.running||transitioning)return;if(state.paused||state.activePower||powerPaused){later(completeInfestation,450);return}transitioning=true;powerPaused=true;freezeWorld=true;if(mode!=='normal')endMode();clearPlayfield();$('#modeTag').textContent='';showBanner('popup_infestation_complete.png',1000);sfx('ui_transition',.22);later(()=>{if(!state.running)return;state.stage++;transitioning=false;powerPaused=false;freezeWorld=false;applyWave(state.stage);scheduleStage()},STAGE_CLEAR_PAUSE)}
function freezeGameplay(on=true){powerPaused=on}
function powerIntro(p,cb){
const meta=POWER_META[p];powerPaused=true;$('#modeTag').textContent=meta.label+' READY';showBanner(meta.popup,850);
later(()=>{powerStage.innerHTML='';cb()},650);
}
function powerOutro(label,delay=450){
later(()=>{$('#modeTag').textContent=label+' COMPLETE';showBanner('popup_stage_clear.png',500)},100);
later(()=>{state.activePower=null;powerStage.innerHTML='';powerPaused=false;freezeWorld=false;$('#modeTag').textContent='';hud()},delay);
}
function usePower(p){
if(!state.running||state.paused||powerPaused||state.activePower||!state.powers[p])return;
state.powers[p]=0;state.activePower=p;hud();sfx('ui_confirm',.28);
powerIntro(p,()=>{
if(p==='magnet')runMagnet();
else if(p==='pollination')runPollination();
else if(p==='love')runLove();
else runDuality();
});
}
function runMagnet(){
$('#modeTag').textContent='MAGGOT MAGNET ACTIVE';sfx('magnet_activate',.28);
const magnet=new Image();magnet.className='powerActor';magnet.src='magnet_idle.png';
magnet.style.cssText='width:24%;left:38%;bottom:-18%;opacity:0;transform:scale(.8);transition:bottom .55s ease-out,opacity .28s linear,transform .55s ease-out';
powerStage.appendChild(magnet);
requestAnimationFrame(()=>{magnet.style.bottom='46px';magnet.style.opacity='1';magnet.style.transform='scale(1)'});
const mags=[...actors].filter(x=>x.kind==='maggot'&&!x.dead),cx=arena.clientWidth*.5-28,cy=arena.clientHeight-104;
const frames=['magnet_idle.png','magnet_pulse_01.png','magnet_pulse_02.png','magnet_pulse_03.png','magnet_pull_01.png','magnet_pull_02.png'];
frames.forEach((src,i)=>later(()=>{if(state.activePower==='magnet'&&magnet.isConnected)magnet.src=src},i*420));
mags.forEach((x,i)=>{const tx=cx+(Math.random()*42-21),ty=cy+(Math.random()*28-14);x.el.style.transition='transform 3s cubic-bezier(.2,.7,.2,1),filter .2s linear';x.el.style.filter='brightness(1.15)';x.x=tx;x.y=ty;later(()=>{if(!x.dead)x.el.style.transform=`translate3d(${tx}px,${ty}px,0)`},80+i*22)});
sfx('magnet_pull',.25);
later(()=>{if(!magnet.isConnected)return;magnet.src='magnet_cluster_03.png';magnet.style.transform='scale(1.08)'},1800);
later(()=>{if(!magnet.isConnected)return;magnet.src='magnet_cluster_hit.png';},2580);
later(()=>{
if(magnet.isConnected)magnet.src='magnet_cluster_pop.png';
mags.forEach(x=>{if(x.dead)return;x.dead=true;x.el.remove();actors=actors.filter(a=>a!==x)});
state.hits+=mags.length;state.score+=100;showBonus('+100 MAGNET');
addFx(cx,cy,'magnet_cleanup_burst.png');sfx('maggot_pop',.25);hud();powerOutro('MAGNET',700);
},3000);
}
function runPollination(){
$('#modeTag').textContent='ROTTEN POLLINATION ACTIVE';sfx('pollination_activate',.25);
state.score+=100;showBonus('+100 POLLINATION');hud();
freezeWorld=true;powerPaused=true;
const bloomFrames=['pollination_bloom_01.png','pollination_bloom_02.png','pollination_bloom_03.png','pollination_bloom_04.png','pollination_bloom_05.png','pollination_bloom_06.png'];
const cloudFrames=['pollination_cloud_01.png','pollination_cloud_02.png','pollination_cloud_03.png','pollination_freeze_01.png','pollination_freeze_02.png'];
const bloom=new Image();bloom.className='powerActor';bloom.src=bloomFrames[0];
bloom.style.cssText='width:25%;right:4%;bottom:52px;opacity:0;transform:scale(.82);transition:opacity .3s linear,transform .35s ease-out';
powerStage.appendChild(bloom);
const cloud=new Image();cloud.className='powerActor';cloud.src=cloudFrames[0];
cloud.style.cssText='width:34%;right:1%;bottom:118px;opacity:0;transform:translateY(14px) scale(.88);transition:opacity .35s linear,transform .45s ease-out';
powerStage.appendChild(cloud);
requestAnimationFrame(()=>{bloom.style.opacity='1';bloom.style.transform='scale(1)';cloud.style.opacity='.92';cloud.style.transform='translateY(0) scale(1)'});
bloomFrames.forEach((src,i)=>later(()=>{if(state.activePower==='pollination'&&bloom.isConnected)bloom.src=src},i*360));
cloudFrames.forEach((src,i)=>later(()=>{if(state.activePower==='pollination'&&cloud.isConnected)cloud.src=src},700+i*420));
later(()=>{actors.forEach(x=>x.el.style.filter='brightness(1.45) saturate(.3) drop-shadow(0 0 5px white)');sfx('pollination_freeze',.22)},1100);
later(()=>{$('#modeTag').textContent='ROTTEN POLLINATION • FROZEN'},1600);
later(()=>{$('#modeTag').textContent='ROTTEN POLLINATION • HOLD'},2800);
later(()=>{
freezeWorld=false;
actors.forEach(x=>x.el.style.filter='');
powerStage.innerHTML='';
powerOutro('POLLINATION',650);
},4300);
}
function enemyBaseValue(x){
if(x.kind==='maggot')return 1;
return x.type==='boss'?10:x.type==='heavy'?4:x.type==='carrier'?3:x.type==='fast'?2:1;
}
function runLove(){
$('#modeTag').textContent='LOVE SICK ACTIVE';sfx('love_sick_activate',.25);
const angel=new Image();angel.className='powerActor';angel.src='love_sick_angel_05.png';
angel.style.cssText='width:46%;left:-52%;top:18%;transition:left 3.2s cubic-bezier(.2,.7,.2,1)';
powerStage.appendChild(angel);
const wave=new Image();wave.className='powerActor';wave.src='love_sick_wave_04.png';
wave.style.cssText='width:74%;left:-80%;top:38%;transition:left 3s ease-out;opacity:.95';
powerStage.appendChild(wave);
requestAnimationFrame(()=>{angel.style.left='103%';wave.style.left='102%'});
later(()=>{
const targets=[...actors];let killedValue=0;
targets.forEach(x=>{
if(x.dead)return;
x.dead=true;killedValue+=enemyBaseValue(x);
x.el.src='fx_heart_burst.png';x.el.style.width='60px';x.el.style.height='60px';
actors=actors.filter(a=>a!==x);
later(()=>x.el.remove(),250);
});
state.score+=222+killedValue;showBonus('+'+(222+killedValue)+' LOVE SICK');
sfx('love_sick_wave',.24);hud();
},1650);
later(()=>powerOutro('LOVE SICK',650),3450);
}
function runDuality(){
$('#modeTag').textContent='FILTHY DUALITY • 7';sfx('duality_activate',.25);
freezeWorld=true;powerPaused=true;
const savedActors=actors.map(x=>({a:x,display:x.el.style.display}));
actors.forEach(x=>x.el.style.display='none');
if(pickup){pickup.style.display='none'}
let count=1,left=7,ended=false;
function draw(){
if(ended)return;
powerStage.innerHTML='';
const n=Math.min(count,32);
for(let i=0;i<n;i++){
const a=new Image();a.className='powerActor dualityTarget';
a.src=count===1?'duality_maggot_idle.png':'duality_maggot_active.png';
const w=Math.max(8,24-Math.log2(n)*2.2);
a.style.width=w+'%';
a.style.left=(3+Math.random()*(91-w))+'%';
a.style.top=(16+Math.random()*58)+'%';
a.style.transform='scale(.45)';
a.style.opacity='0';
a.style.transition='transform .18s ease-out,opacity .18s';
a.addEventListener('pointerdown',()=>{
if(ended)return;
count=Math.min(count*2,32);
sfx('duality_split',.18);
draw();
});
powerStage.appendChild(a);
requestAnimationFrame(()=>{a.style.transform='scale(1)';a.style.opacity='1'});
}
}
function tick(){
if(left<=0){
ended=true;
powerStage.innerHTML='';
savedActors.forEach(x=>x.a.el.style.display=x.display);
if(pickup)pickup.style.display='';
state.score+=1000;showBonus('+1000 DUALITY');
freezeWorld=false;
addFx(arena.clientWidth/2-40,arena.clientHeight/2-40,'fx_mass_pop.png');
sfx('score_bonus',.25);hud();
powerOutro('DUALITY');
return;
}
$('#modeTag').textContent='FILTHY DUALITY • '+left;
left--;
later(tick,1000);
}
draw();tick();
}
function loop(t){if(!state.running)return;if(!last)last=t;const dt=Math.min(.033,(t-last)/1000);last=t;if(!state.paused&&!powerPaused&&!freezeWorld){if(modeUntil&&t>=modeUntil)endMode();const plan=currentWavePlan();if(t>=nextFly&&mode!=='maggotRush'){addFly(chooseFly(plan.types||{basic:1}));nextFly=t+(mode==='flyFrenzy'?Math.min(230,plan.flyMs):plan.flyMs)}if(t>=nextMaggot&&mode!=='flyFrenzy'){addMaggot(null,null,mode==='maggotRush'?95:88);nextMaggot=t+(mode==='maggotRush'?Math.min(650,plan.maggotMs):plan.maggotMs)}for(const a of [...actors]){if(a.dead||t<(a.frozenUntil||0))continue;if(a.kind==='fly'){a.x+=a.vx*dt;a.y=a.baseY+Math.sin(t/280+a.phase)*18;if(a.x<0||a.x>arena.clientWidth-68){a.vx*=-1;a.x=Math.max(0,Math.min(arena.clientWidth-68,a.x))}if(t-a.lastFrame>170){a.lastFrame=t;a.frame=(a.frame+1)%2;a.el.src=a.frames[a.frame]}if(t>a.expires){a.dead=true;a.el.remove();actors=actors.filter(x=>x!==a);state.misses++;hud()}}else{a.y+=a.vy*dt;if(t-a.lastFrame>180){a.lastFrame=t;a.frame=(a.frame+1)%2;a.el.src=`maggot_crawl_0${a.frame+1}.png`}if(a.y>=arena.clientHeight-58){a.y=arena.clientHeight-58;a.el.style.transform=`translate3d(${a.x}px,${a.y}px,0)`;maggotLanded(a);continue}}a.el.style.transform=`translate3d(${a.x}px,${a.y}px,0)`}}raf=requestAnimationFrame(loop)}
function reset(){playMusic('gameplay');clearAll();lastRotBlocks=0;powerPaused=false;freezeWorld=false;transitioning=false;pickup=null;arena.innerHTML='';powerStage.innerHTML='';state=fresh();state.running=true;last=0;lastFlyRow=-1;mode='normal';modeUntil=0;$('#bonusToast').textContent='';$('#bonusToast').classList.remove('show');$('#results').classList.remove('show');$('#results').style.backgroundImage="linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.58)),url('bg_game_over.png')";$('#resultHeadline').src='popup_stage_failed.png';$('#pauseOverlay').classList.remove('show');hud();applyWave(1);raf=requestAnimationFrame(loop);scheduleStage()}
function scheduleStage(){later(()=>{if(!state.running)return;completeInfestation()},STAGE_MS)}
function endGame(){if(!state.running)return;state.running=false;state.paused=true;const acc=state.hits+state.misses?Math.round(state.hits/(state.hits+state.misses)*100):100;$('#resultHeadline').src='popup_stage_failed.png';$('#resultHeadline').alt='Game Over';$('#results').style.backgroundImage="linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.58)),url('bg_game_over.png')";$('#resultStats').innerHTML=`<strong>${state.score}</strong><br>SCORE<br>${state.kills} FLY KILLS • ${state.maggots} MAGGOTS<br>${acc}% ACCURACY`;$('#results').classList.add('show');playMusic('results');sfx('ui_transition')}
function pause(force){if(!state.running)return;state.paused=force===undefined?!state.paused:force;$('#pauseOverlay').classList.toggle('show',state.paused);$('#pauseBtn').src=state.paused?'ui_resume.png':'ui_pause.png';sfx('ui_tap',.2)}
const startGame=()=>{screen('play');reset()};
function goHome(){
state.running=false;state.paused=false;clearAll();powerPaused=false;freezeWorld=false;transitioning=false;pickup=null;mode='normal';modeUntil=0;last=0;lastRotBlocks=0;lastFlyRow=-1;clearTimeout(bonusTimer);
arena.innerHTML='';powerStage.innerHTML='';banner.classList.remove('showBanner');$('#results').classList.remove('show');$('#pauseOverlay').classList.remove('show');$('#pauseBtn').src='ui_pause.png';
screen('home');updateAudioIcons();if(musicOn)playMusic('menu');else stopMusic();
}
function bindPress(el,fn){if(!el)return;el.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();fn(ev)},{passive:false})}
bindPress($('#startPopup'),startGame);
bindPress($('#rulesBtn'),()=>{screen('rules');sfx('ui_tap',.2)});
bindPress($('#rulesBackBtn'),()=>{screen('home');sfx('ui_back',.22)});
function updateAudioIcons(){
const s=soundOn?'ui_sound_on.png':'ui_sound_off.png',m=musicOn?'ui_music_on.png':'ui_music_off.png';
$('#soundBtn').src=s;$('#homeSoundBtn').src=s;$('#homeMusicBtn').src=m;
$('#homeSoundBtn').setAttribute('aria-label',soundOn?'Sound on':'Sound off');$('#homeMusicBtn').setAttribute('aria-label',musicOn?'Music on':'Music off');
}
bindPress($('#homeSoundBtn'),()=>{soundOn=!soundOn;updateAudioIcons()});
bindPress($('#homeMusicBtn'),()=>{musicOn=!musicOn;updateAudioIcons();requestAnimationFrame(()=>{if(!musicOn)stopMusic();else playMusic(home.classList.contains('active')?'menu':'gameplay')})});
bindPress($('#pauseBtn'),()=>pause());bindPress($('#resumeBtn'),()=>pause(false));bindPress($('#homeBtn'),goHome);bindPress($('#retryBtn'),reset);bindPress($('#resultHomeBtn'),goHome);bindPress($('#soundBtn'),()=>{soundOn=!soundOn;updateAudioIcons()});$$('.pu').forEach(b=>bindPress(b,()=>usePower(b.dataset.p)));window.addEventListener('blur',()=>state.running&&pause(true));
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('error',e=>{if(e.target?.tagName==='IMG'){console.error('Missing graphic:',e.target.getAttribute('src'));e.target.style.visibility='hidden'}},true);

updateAudioIcons();
})();
</script>
