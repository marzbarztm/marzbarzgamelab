<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,viewport-fit=cover,user-scalable=no">
<title>Rotted Threadz: Maggot Rush</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;font-family:Arial,Helvetica,sans-serif;color:#fff}
body{display:grid;place-items:center}
#game{position:relative;width:min(100vw,562.5px);height:min(100dvh,1000px);aspect-ratio:9/16;overflow:hidden;background:#050505 center/cover no-repeat;touch-action:none;user-select:none}
.screen{position:absolute;inset:0;display:none}.screen.active{display:block}
#home{background:url('bg_home.png') center/cover no-repeat}
.logo{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:82%;height:auto;object-fit:contain}








#rules{background:#050505 url('bg_rules.png') center/cover no-repeat;z-index:8}
.rulesBack{position:absolute;left:5%;top:max(16px,env(safe-area-inset-top));width:54px;height:54px;border:0;background:transparent;padding:0;cursor:pointer;z-index:9}
.rulesBack img{width:100%;height:100%;object-fit:contain}
.rulesFallback{position:absolute;left:8%;right:8%;top:17%;bottom:9%;padding:22px;background:rgba(0,0,0,.78);border:2px solid rgba(255,255,255,.22);overflow:auto;text-align:left;line-height:1.45}
.rulesFallback h2{margin:0 0 12px;font-size:24px;letter-spacing:2px}.rulesFallback b{color:#d4ff72}

#home .logo{position:absolute;left:50%;top:15%;transform:translateX(-50%);width:92%;max-width:520px;max-height:39%;object-fit:contain;filter:drop-shadow(0 10px 14px #000);z-index:3}
#startPopup{position:absolute;left:50%;top:51%;transform:translateX(-50%);width:64%;max-width:360px;height:auto;object-fit:contain;cursor:pointer;z-index:4;filter:drop-shadow(0 7px 10px rgba(0,0,0,.72));animation:startPulse 1.05s ease-in-out infinite}
@keyframes startPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07);filter:brightness(1.14) drop-shadow(0 8px 12px rgba(0,0,0,.8))}}
.homeControls{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);width:88%;display:flex;justify-content:center;align-items:center;gap:8%;z-index:6}
.homeIconBtn{width:82px;height:82px;border:0;background:transparent;padding:0;cursor:pointer;touch-action:manipulation}
.homeIconBtn img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(0,0,0,.72))}
.homeIconBtn:active{transform:scale(.94)}
#rules{background:#050505 url('bg_rules.png') center/cover no-repeat;z-index:8}
.rulesBack{position:absolute;left:5%;top:max(16px,env(safe-area-inset-top));width:64px;height:64px;border:0;background:transparent;padding:0;cursor:pointer;z-index:9}
.rulesBack img{width:100%;height:100%;object-fit:contain}
.rulesFallback{display:none}

#play{background:url('bg_gameplay_01.png') center/cover no-repeat}
.hud{position:absolute;z-index:20;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;pointer-events:none}
.top{display:flex;gap:6px;align-items:flex-start}.hudPanel{position:relative;width:29%;height:58px;background:center/100% 100% no-repeat;display:grid;place-items:center;text-align:center}.hudPanel.score{background-image:url('hud_score_panel.png')}.hudPanel.combo{background-image:url('hud_combo_panel.png')}.hudPanel.stage{background-image:url('hud_counter_panel.png');width:21%}.hudPanel b{font-size:18px;line-height:1}.hudPanel small{font-size:8px;letter-spacing:1px;opacity:.8}.hudPanel>div{padding-top:3px}
.hudIcon{width:38px;height:38px;object-fit:contain;pointer-events:auto;cursor:pointer}.top .hudIcon:first-of-type{margin-left:auto}
#rot{position:relative;height:24px;margin-top:5px}.rotFrame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}.rotFillWrap{position:absolute;left:3.5%;right:3.5%;top:26%;bottom:27%;overflow:hidden}.rotFill{height:100%;width:0;background:linear-gradient(90deg,#61ed28,#d9ef35,#9f1010);transition:width .12s linear}
#arena{position:absolute;inset:100px 0 108px;overflow:hidden}
.sprite{position:absolute;object-fit:contain;touch-action:none;will-change:transform;z-index:8}.powerPickup{position:absolute;width:66px;height:66px;object-fit:contain;z-index:24;cursor:pointer;filter:drop-shadow(0 0 8px rgba(255,255,255,.55));animation:pickupPulse .75s ease-in-out infinite alternate}@keyframes pickupPulse{to{transform:scale(1.12);filter:drop-shadow(0 0 13px rgba(255,255,255,.9))}}.powerActor{z-index:38}.maggotWarn{animation:maggotWarn .24s steps(2,end) infinite}@keyframes maggotWarn{50%{filter:brightness(1.9) drop-shadow(0 0 7px #aaff39)}}.fly{width:68px;height:68px}.maggot{width:56px;height:56px}.fx{position:absolute;width:80px;height:80px;object-fit:contain;pointer-events:none;z-index:12;animation:pop .35s ease-out forwards}@keyframes pop{to{transform:scale(1.4);opacity:0}}
#tray{position:absolute;z-index:25;bottom:max(8px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:94%;height:88px;background:url('hud_powerup_tray.png') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;gap:2.5%}.pu{position:relative;width:20%;aspect-ratio:1;border:0;background:transparent;padding:0;touch-action:manipulation}.pu img{width:100%;height:100%;object-fit:contain}.pu.empty{opacity:.32}.pu.disabled{filter:grayscale(1) brightness(.45)}.charge{position:absolute;right:4px;bottom:4px;background:#000;border:1px solid #fff;border-radius:10px;padding:1px 5px;font-size:10px}
#banner{display:none;position:absolute;z-index:45;left:50%;top:35%;transform:translate(-50%,-50%);width:86%;object-fit:contain;pointer-events:none}.showBanner{display:block!important;animation:banner .9s ease both}@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(.98)}}
#powerStage{position:absolute;inset:0;z-index:35;pointer-events:none}.powerActor{position:absolute;object-fit:contain}.dualityTarget{pointer-events:auto}
.overlay{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}.overlay.show{display:flex}.overlay .headline{width:78%;max-height:26%;object-fit:contain}.iconBtn{border:0;background:transparent;padding:0;width:72px;height:72px}.iconBtn img{width:100%;height:100%;object-fit:contain}.stats{width:82%;padding:14px;background:rgba(0,0,0,.78);border:2px solid rgba(255,255,255,.24);text-align:center;line-height:1.8}
#results{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),url('bg_results.png') center/cover no-repeat}
.modeTag{position:absolute;top:105px;left:50%;transform:translateX(-50%);z-index:19;font-size:10px;letter-spacing:2px;opacity:.75}
</style>
</head>
<body>
<div id="game">
<section id="home" class="screen active">
<img class="logo" src="logo_maggot_rush.png" alt="Maggot Rush">
<img id="startPopup" src="popup_push_to_start.png" alt="Push to Start">
<div class="homeControls">
<button id="rulesBtn" class="homeIconBtn" aria-label="Rules"><img src="icon_rules.png" alt="Rules"></button>
<button id="homeSoundBtn" class="homeIconBtn" aria-label="Sound"><img src="ui_sound_on.png" alt="Sound"></button>
<button id="homeMusicBtn" class="homeIconBtn" aria-label="Music"><img src="ui_music_on.png" alt="Music"></button>
</div>
</section>
<section id="rules" class="screen">
<button id="rulesBackBtn" class="rulesBack"><img src="ui_back.png" alt="Back"></button>

</section>
<section id="play" class="screen">
<div class="hud"><div class="top"><div class="hudPanel score"><div><b id="score">0</b><br><small>SCORE</small></div></div><div class="hudPanel combo"><div><b id="combo">x1</b><br><small>COMBO</small></div></div><div class="hudPanel stage"><div><b id="stage">1</b><br><small>STAGE</small></div></div><img id="pauseBtn" class="hudIcon" src="ui_pause.png"><img id="soundBtn" class="hudIcon" src="ui_sound_on.png"></div><div id="rot"><div class="rotFillWrap"><div id="rotFill" class="rotFill"></div></div><img class="rotFrame" src="hud_rot_meter_frame.png"></div></div>
<div id="modeTag" class="modeTag"></div><div id="arena"></div><img id="banner"><div id="powerStage"></div>
<div id="tray"><button class="pu empty" data-p="love"><img src="powerup_love_sick.png"><span class="charge">0</span></button><button class="pu empty" data-p="pollination"><img src="powerup_rotten_pollination.png"><span class="charge">0</span></button><button class="pu empty" data-p="magnet"><img src="powerup_maggot_magnet.png"><span class="charge">0</span></button><button class="pu empty" data-p="duality"><img src="powerup_filthy_duality.png"><span class="charge">0</span></button></div>
<div id="pauseOverlay" class="overlay"><img class="headline" src="popup_paused.png"><button id="resumeBtn" class="iconBtn"><img src="ui_resume.png"></button><button id="homeBtn" class="iconBtn"><img src="ui_home.png"></button></div>
<div id="results" class="overlay"><img id="resultHeadline" class="headline" src="popup_infestation_complete.png"><div id="resultStats" class="stats"></div><button id="retryBtn" class="iconBtn"><img src="ui_retry.png"></button><button id="resultHomeBtn" class="iconBtn"><img src="ui_home.png"></button></div>
</section></div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const home=$('#home'),play=$('#play'),arena=$('#arena'),banner=$('#banner'),powerStage=$('#powerStage');
const soundFiles=['ui_tap','ui_confirm','ui_back','ui_transition','fly_hit','fly_pop','fly_heavy_pop','maggot_split','maggot_pop','combo_rise','score_bonus','love_sick_activate','love_sick_wave','pollination_activate','pollination_freeze','magnet_activate','magnet_pull','duality_activate','duality_split'];
const sounds={};soundFiles.forEach(n=>{const a=new Audio('Audio/'+n+'.mp3');a.preload='none';if(n.includes('loop'))a.loop=true;sounds[n]=a});
let soundOn=true;function sfx(n,v=.55){if(!soundOn||!sounds[n])return;try{const a=sounds[n].cloneNode();a.volume=v;a.play().catch(()=>{})}catch{}}
let musicOn=true,currentMusic=null;
const musicFiles={menu:'Audio/music_menu.mp3',gameplay:'Audio/music_gameplay.mp3',frenzy:'Audio/music_rush.mp3',results:'Audio/music_results.mp3'};
function playMusic(key){if(currentMusic){currentMusic.pause();currentMusic=null}if(!musicOn||!musicFiles[key])return;const a=new Audio(musicFiles[key]);a.loop=true;a.volume=.38;a.play().catch(()=>{});currentMusic=a}
function stopMusic(){if(currentMusic){currentMusic.pause();currentMusic=null}}

const flyFrames={
basic:{flap:['fly_basic_flap_01.png','fly_basic_flap_02.png'],defeat:'fly_basic_defeat.png'},
fast:{flap:['fly_fast_flap_01.png','fly_fast_flap_02.png'],defeat:'fly_fast_defeat.png'},
carrier:{flap:['fly_carrier_flap_01.png','fly_carrier_flap_02.png'],defeat:'fly_carrier_defeat.png'},
heavy:{flap:['fly_heavy_flap_01.png','fly_heavy_flap_02.png'],defeat:'fly_heavy_defeat.png'},
boss:{flap:['fly_boss_flap_01.png','fly_boss_flap_02.png'],defeat:'fly_boss_defeat.png'}
};
const preload=[
...Object.values(flyFrames).flatMap(v=>[...v.flap,v.defeat]),
'maggot_crawl_01.png','maggot_crawl_02.png','fx_maggot_pop.png',
'powerup_love_sick.png','powerup_rotten_pollination.png','powerup_maggot_magnet.png','powerup_filthy_duality.png'
];preload.forEach(src=>{const i=new Image();i.src=src});
let state,actors=[],timeouts=[],raf=0,last=0,nextFly=0,nextMaggot=0,modeUntil=0,mode='normal';
let pickup=null,powerPaused=false;
const MAX_FLIES_NORMAL=9,MAX_FLIES_FRENZY=12,MAX_MAGGOTS_NORMAL=8,MAX_MAGGOTS_RUSH=12,MAX_TOTAL_ACTORS=18;
const POWER_DROP_EVERY=40;
const POWER_WEIGHTS=[['magnet',.40],['pollination',.30],['love',.20],['duality',.10]];
const POWER_META={
magnet:{icon:'powerup_maggot_magnet.png',popup:'popup_maggot_magnet.png',label:'MAGGOT MAGNET'},
pollination:{icon:'powerup_rotten_pollination.png',popup:'popup_rotten_pollination.png',label:'ROTTEN POLLINATION'},
love:{icon:'powerup_love_sick.png',popup:'popup_love_sick.png',label:'LOVE SICK'},
duality:{icon:'powerup_filthy_duality.png',popup:'popup_filthy_duality.png',label:'FILTHY DUALITY'}
};
const fresh=()=>({running:false,paused:false,score:0,combo:1,hits:0,misses:0,kills:0,maggots:0,rot:0,stage:1,powers:{love:0,pollination:0,magnet:0,duality:0},activePower:null});state=fresh();
function later(fn,ms){const id=setTimeout(fn,ms);timeouts.push(id);return id}function clearAll(){timeouts.forEach(clearTimeout);timeouts=[];cancelAnimationFrame(raf);actors.forEach(a=>a.el?.remove());actors=[];if(pickup){pickup.remove();pickup=null}}
function screen(name){home.classList.toggle('active',name==='home');$('#rules').classList.toggle('active',name==='rules');play.classList.toggle('active',name==='play')}
function hud(){$('#score').textContent=state.score;$('#combo').textContent='x'+state.combo;$('#stage').textContent=state.stage;$('#rotFill').style.width=Math.min(100,state.rot)+'%';$$('.pu').forEach(b=>{const p=b.dataset.p,c=state.powers[p];b.classList.toggle('empty',!c);b.classList.toggle('disabled',!!state.activePower&&state.activePower!==p);b.querySelector('.charge').textContent=c})}
function showBanner(src,ms=1000){banner.src=src;banner.classList.remove('showBanner');void banner.offsetWidth;banner.classList.add('showBanner');later(()=>banner.classList.remove('showBanner'),ms)}
function addFx(x,y,src){const e=new Image();e.className='fx';e.src=src;e.style.left=x+'px';e.style.top=y+'px';arena.appendChild(e);later(()=>e.remove(),380)}
function countKind(kind){return actors.reduce((n,a)=>n+(!a.dead&&a.kind===kind?1:0),0)}
function addFly(type='basic'){
if(!state.running||state.paused||powerPaused)return;
const flyCap=mode==='flyFrenzy'?MAX_FLIES_FRENZY:MAX_FLIES_NORMAL;
if(countKind('fly')>=flyCap||actors.length>=MAX_TOTAL_ACTORS)return;
const spec=flyFrames[type]||flyFrames.basic,frames=spec.flap,e=new Image();e.className='sprite fly';e.src=frames[0];arena.appendChild(e);
const hp=type==='boss'?4:type==='heavy'?2:1;
const speed=type==='fast'?145:type==='boss'?48:type==='heavy'?55:type==='carrier'?88:82;
const life=type==='fast'?3000:type==='boss'?8000:type==='heavy'?5600:4400;
const a={kind:'fly',type,el:e,frames,defeat:spec.defeat,frame:0,lastFrame:0,
x:Math.random()*Math.max(1,arena.clientWidth-70),y:20+Math.random()*Math.max(40,arena.clientHeight-120),
vx:(Math.random()<.5?-1:1)*speed,hp,expires:performance.now()+life};
actors.push(a);
e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(a.dead||state.paused||powerPaused)return;a.hp--;if(a.hp<=0)killFly(a)});
}
function killFly(a){
if(a.dead)return;
a.dead=true;
actors=actors.filter(x=>x!==a);
state.kills++;state.hits++;state.combo=Math.min(20,state.combo+1);
state.score+=(a.type==='boss'?10:a.type==='heavy'?4:a.type==='carrier'?3:a.type==='fast'?2:1);
a.el.src=a.defeat;a.el.style.pointerEvents='none';
later(()=>a.el.remove(),180);
sfx(a.type==='heavy'||a.type==='boss'?'fly_heavy_pop':'fly_pop',.30);
if(state.combo%5===0)sfx('combo_rise',.22);
if(state.kills>0&&state.kills%POWER_DROP_EVERY===0)spawnPowerPickup();
hud();
}
function maggotDistanceOK(x,y,minDist=90){return !actors.some(o=>o.kind==='maggot'&&!o.dead&&Math.hypot(o.x-x,o.y-y)<minDist)}
function findMaggotSpot(preferredX=null,preferredY=null,minDist=90){const maxX=Math.max(1,arena.clientWidth-56),maxY=Math.max(1,arena.clientHeight-56);for(let i=0;i<24;i++){let x=preferredX==null?Math.random()*maxX:Math.max(0,Math.min(maxX,preferredX+(Math.random()*180-90)));let y=preferredY==null?Math.max(20,arena.clientHeight-70-Math.random()*Math.min(220,arena.clientHeight*.38)):Math.max(20,Math.min(maxY,preferredY+(Math.random()*150-75)));if(maggotDistanceOK(x,y,minDist))return{x,y}}return{x:Math.random()*maxX,y:Math.max(20,Math.random()*maxY)}}
function addMaggot(x=null,y=null,minDist=90){if(!state.running||state.paused||powerPaused)return;const cap=mode==='maggotRush'?MAX_MAGGOTS_RUSH:MAX_MAGGOTS_NORMAL;if(countKind('maggot')>=cap||actors.length>=MAX_TOTAL_ACTORS)return;const spot=findMaggotSpot(x,y,minDist),e=new Image();e.className='sprite maggot';e.src='maggot_crawl_01.png';arena.appendChild(e);const a={kind:'maggot',el:e,x:spot.x,y:spot.y,frame:0,lastFrame:0,born:performance.now(),warned:false,deadline:performance.now()+3000};actors.push(a);state.maggots++;e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(a.dead||state.paused)return;a.dead=true;e.remove();actors=actors.filter(x=>x!==a);state.score+=1;state.hits++;addFx(a.x,a.y,'fx_maggot_pop.png');sfx('maggot_pop',.32);hud()})}
function splitMaggot(a){if(a.dead)return;a.dead=true;a.el.remove();actors=actors.filter(x=>x!==a);state.rot+=10;sfx('maggot_split',.32);const angles=[-2.35,-1.57,-.78];const spread=105;angles.forEach((ang,i)=>{const tx=a.x+Math.cos(ang)*spread,ty=a.y+Math.sin(ang)*spread;later(()=>{if(countKind('maggot')<(mode==='maggotRush'?MAX_MAGGOTS_RUSH:MAX_MAGGOTS_NORMAL))addMaggot(tx,ty,105)},i*80)});hud();if(state.rot>=100)endGame()}
function weightedPower(){
let r=Math.random(),sum=0;for(const [p,w] of POWER_WEIGHTS){sum+=w;if(r<=sum)return p}return'magnet'
}
function spawnPowerPickup(){
if(pickup||!state.running||state.paused||powerPaused)return;
const available=Object.keys(state.powers).filter(p=>state.powers[p]<1);
if(!available.length)return;
let p=weightedPower();if(!available.includes(p))p=available[Math.floor(Math.random()*available.length)];
const meta=POWER_META[p],e=new Image();e.className='powerPickup';e.src=meta.icon;e.dataset.power=p;
const x=18+Math.random()*Math.max(1,arena.clientWidth-102),y=45+Math.random()*Math.max(1,arena.clientHeight-165);
e.style.left=x+'px';e.style.top=y+'px';arena.appendChild(e);pickup=e;
const expire=later(()=>{if(pickup===e){e.remove();pickup=null}},6500);
e.addEventListener('pointerdown',ev=>{
ev.preventDefault();if(state.paused||powerPaused||pickup!==e)return;
clearTimeout(expire);state.powers[p]=1;e.remove();pickup=null;hud();
showBanner(meta.popup,1100);sfx('score_bonus',.28);
});
}
function setGameplayBackground(stage=state.stage){const src=stage>=7?'bg_gameplay_03.png':stage>=4?'bg_gameplay_02.png':'bg_gameplay_01.png';play.style.backgroundImage=`url('${src}')`}
function beginFlyFrenzy(fullWave=false){playMusic('frenzy');mode='flyFrenzy';modeUntil=fullWave?0:performance.now()+7000;$('#modeTag').textContent='FLY FRENZY';showBanner('popup_fly_frenzy.png');play.style.backgroundImage="url('bg_fly_rush.png')";for(let i=0;i<8;i++)later(()=>addFly(i%3===0?'fast':'basic'),i*170)}
function beginMaggotRush(fullWave=false){mode='maggotRush';modeUntil=fullWave?0:performance.now()+7000;$('#modeTag').textContent='MAGGOT RUSH';showBanner('popup_maggot_rush.png');for(let i=0;i<6;i++)later(()=>{if(countKind('maggot')<MAX_MAGGOTS_RUSH)addMaggot(null,null,110)},i*420)}
function endMode(){playMusic('gameplay');mode='normal';modeUntil=0;$('#modeTag').textContent='';setGameplayBackground()}
const wavePlans={
1:{name:'INFESTATION BEGINS',flyMs:560,maggotMs:11000,types:{basic:.93,fast:.07},maggotDelay:14500},
2:{name:'CRAWLING PROBLEM',flyMs:690,maggotMs:4300,types:{basic:.72,fast:.28}},
3:{name:'FLY FRENZY',flyMs:360,maggotMs:999999,types:{basic:.68,fast:.32},mode:'flyFrenzy'},
4:{name:'INFESTATION SPREADS',flyMs:760,maggotMs:2500,types:{basic:.58,fast:.27,carrier:.15}},
5:{name:'HEAVY TRAFFIC',flyMs:650,maggotMs:3600,types:{basic:.44,fast:.25,carrier:.18,heavy:.13}},
6:{name:'MAGGOT RUSH',flyMs:1250,maggotMs:620,types:{basic:.65,fast:.25,carrier:.10},mode:'maggotRush'},
7:{name:'CONTAMINATION',flyMs:540,maggotMs:2700,types:{basic:.34,fast:.27,carrier:.23,heavy:.16}},
8:{name:'PRESSURE WAVE',flyMs:420,maggotMs:3100,types:{basic:.38,fast:.33,carrier:.18,heavy:.11}},
9:{name:'SWARM',flyMs:400,maggotMs:4200,types:{basic:.48,fast:.35,carrier:.11,heavy:.06}},
10:{name:'FULL INFESTATION',flyMs:460,maggotMs:2100,types:{basic:.28,fast:.27,carrier:.22,heavy:.18,boss:.05}}
};
function currentWavePlan(){if(state.stage<=10)return wavePlans[state.stage];const cycle=[7,8,9,10][(state.stage-11)%4],base=wavePlans[cycle],tier=1+Math.floor((state.stage-11)/4)*.08;return{...base,name:'REMIX '+state.stage,flyMs:Math.max(180,base.flyMs/tier),maggotMs:Math.max(1000,base.maggotMs/tier),mode:state.stage%6===0?'maggotRush':state.stage%5===0?'flyFrenzy':undefined}}
function chooseFly(types){const r=Math.random();let sum=0;for(const [type,w] of Object.entries(types)){sum+=w;if(r<=sum)return type}return'basic'}
function applyWave(stage=state.stage,announce=true){if(mode!=='normal')endMode();const p=currentWavePlan();$('#modeTag').textContent=p.name;setGameplayBackground(stage);if(p.mode==='flyFrenzy')beginFlyFrenzy(true);else if(p.mode==='maggotRush')beginMaggotRush(true);else mode='normal';if(announce&&stage>1)showBanner('popup_stage_clear.png',700);nextFly=performance.now()+120;nextMaggot=performance.now()+(p.maggotDelay||p.maggotMs)}
function freezeGameplay(on=true){powerPaused=on}
function powerIntro(p,cb){
const meta=POWER_META[p];powerPaused=true;$('#modeTag').textContent=meta.label+' READY';showBanner(meta.popup,850);
later(()=>{powerStage.innerHTML='';cb()},650);
}
function powerOutro(label,delay=450){
later(()=>{$('#modeTag').textContent=label+' COMPLETE';showBanner('popup_stage_clear.png',500)},100);
later(()=>{state.activePower=null;powerStage.innerHTML='';powerPaused=false;$('#modeTag').textContent='';hud()},delay);
}
function usePower(p){
if(!state.running||state.paused||powerPaused||state.activePower||!state.powers[p])return;
state.powers[p]=0;state.activePower=p;hud();sfx('ui_confirm',.28);
powerIntro(p,()=>{
if(p==='magnet')runMagnet();
else if(p==='pollination')runPollination();
else if(p==='love')runLove();
else runDuality();
});
}
function runMagnet(){
$('#modeTag').textContent='MAGGOT MAGNET ACTIVE';sfx('magnet_activate',.28);
const a=new Image();a.className='powerActor';a.src='magnet_pulse_03.png';a.style.cssText='width:34%;left:33%;top:34%';powerStage.appendChild(a);
const mags=[...actors].filter(x=>x.kind==='maggot'&&!x.dead),cx=arena.clientWidth*.5-28,cy=arena.clientHeight*.5-28;
mags.forEach(x=>{x.el.style.transition='transform .65s ease-in';x.x=cx;x.y=cy;x.el.style.transform=`translate3d(${cx}px,${cy}px,0)`});
sfx('magnet_pull',.25);
later(()=>{
let bonus=0;
mags.forEach(x=>{if(x.dead)return;x.dead=true;x.el.remove();actors=actors.filter(a=>a!==x);bonus+=125});
state.score+=bonus;addFx(cx,cy,'fx_maggot_pop.png');sfx('maggot_pop',.25);hud();powerOutro('MAGNET');
},800);
}
function runPollination(){
$('#modeTag').textContent='ROTTEN POLLINATION • FREEZE 5';sfx('pollination_activate',.25);
const a=new Image();a.className='powerActor';a.src='pollination_bloom_06.png';a.style.cssText='width:43%;left:28%;top:28%';powerStage.appendChild(a);
actors.forEach(x=>x.el.style.filter='brightness(1.35) saturate(.45) drop-shadow(0 0 6px white)');
sfx('pollination_freeze',.22);
let left=5;
const tick=()=>{if(left<=0){actors.forEach(x=>x.el.style.filter='');powerOutro('POLLINATION');return}$('#modeTag').textContent='ROTTEN POLLINATION • FREEZE '+left;left--;later(tick,1000)};tick();
}
function runLove(){
$('#modeTag').textContent='LOVE SICK ACTIVE';sfx('love_sick_activate',.25);
const angel=new Image();angel.className='powerActor';angel.src='love_sick_angel_05.png';angel.style.cssText='width:40%;left:-42%;top:25%;transition:left 1.6s linear';powerStage.appendChild(angel);
const wave=new Image();wave.className='powerActor';wave.src='love_sick_wave_04.png';wave.style.cssText='width:58%;left:-62%;top:42%;transition:left 1.55s linear;opacity:.9';powerStage.appendChild(wave);
requestAnimationFrame(()=>{angel.style.left='104%';wave.style.left='105%'});
later(()=>{
const targets=[...actors];let bonus=0;
targets.forEach(x=>{if(x.dead)return;x.dead=true;x.el.src='fx_heart_burst.png';x.el.style.width='62px';x.el.style.height='62px';actors=actors.filter(a=>a!==x);bonus+=x.kind==='fly'?225:175;later(()=>x.el.remove(),300)});
state.score+=bonus;sfx('love_sick_wave',.24);hud();
},700);
later(()=>powerOutro('LOVE SICK'),1800);
}
function runDuality(){
$('#modeTag').textContent='FILTHY DUALITY • 7';sfx('duality_activate',.25);
const savedActors=actors.map(x=>({a:x,display:x.el.style.display}));actors.forEach(x=>x.el.style.display='none');
let count=1,bonus=0,left=7,ended=false;
function draw(){
if(ended)return;powerStage.innerHTML='';
const n=Math.min(count,48);
for(let i=0;i<n;i++){const a=new Image();a.className='powerActor dualityTarget';a.src=count===1?'duality_maggot_idle.png':'duality_maggot_active.png';const w=Math.max(7,22-Math.log2(n)*2);a.style.width=w+'%';a.style.left=(3+Math.random()*(90-w))+'%';a.style.top=(17+Math.random()*57)+'%';a.addEventListener('pointerdown',()=>{if(ended)return;count*=2;bonus+=count*25;sfx('duality_split',.20);draw()});powerStage.appendChild(a)}
}
function tick(){if(left<=0){ended=true;powerStage.innerHTML='';savedActors.forEach(x=>x.a.el.style.display=x.display);state.score+=bonus;addFx(arena.clientWidth/2-40,arena.clientHeight/2-40,'fx_mass_pop.png');sfx('score_bonus',.25);hud();powerOutro('DUALITY');return}$('#modeTag').textContent='FILTHY DUALITY • '+left;left--;later(tick,1000)}
draw();tick();
}
function loop(t){if(!state.running)return;if(!last)last=t;const dt=Math.min(.033,(t-last)/1000);last=t;if(!state.paused&&!powerPaused){if(modeUntil&&t>=modeUntil)endMode();const plan=currentWavePlan();if(t>=nextFly&&mode!=='maggotRush'){addFly(chooseFly(plan.types||{basic:1}));nextFly=t+(mode==='flyFrenzy'?Math.min(230,plan.flyMs):plan.flyMs)}if(t>=nextMaggot&&mode!=='flyFrenzy'){addMaggot(null,null,mode==='maggotRush'?95:88);nextMaggot=t+(mode==='maggotRush'?Math.min(650,plan.maggotMs):plan.maggotMs)}for(const a of [...actors]){if(a.dead||t<(a.frozenUntil||0))continue;if(a.kind==='fly'){a.x+=a.vx*dt;a.y+=Math.sin(t/280+a.x)*18*dt;if(a.x<0||a.x>arena.clientWidth-68){a.vx*=-1;a.x=Math.max(0,Math.min(arena.clientWidth-68,a.x))}if(t-a.lastFrame>110){a.lastFrame=t;a.frame=(a.frame+1)%2;a.el.src=a.frames[a.frame]}if(t>a.expires){a.dead=true;a.el.remove();actors=actors.filter(x=>x!==a);state.combo=1;state.misses++;hud()}}else{if(t-a.lastFrame>170){a.lastFrame=t;a.frame=(a.frame+1)%2;a.el.src=`maggot_crawl_0${a.frame+1}.png`}if(!a.warned&&t>a.deadline-900){a.warned=true;a.el.classList.add('maggotWarn')}if(t>a.deadline)splitMaggot(a)}a.el.style.transform=`translate3d(${a.x}px,${a.y}px,0)`}}raf=requestAnimationFrame(loop)}
function reset(){playMusic('gameplay');clearAll();powerPaused=false;pickup=null;arena.innerHTML='';powerStage.innerHTML='';state=fresh();state.running=true;last=0;mode='normal';modeUntil=0;$('#results').classList.remove('show');$('#pauseOverlay').classList.remove('show');hud();applyWave(1,false);raf=requestAnimationFrame(loop);stageTimer()}
function stageTimer(){later(()=>{if(!state.running)return;state.stage++;hud();applyWave(state.stage,true);stageTimer()},25000)}
function endGame(){state.running=false;state.paused=true;const acc=state.hits+state.misses?Math.round(state.hits/(state.hits+state.misses)*100):100;$('#resultStats').innerHTML=`<strong>${state.score}</strong><br>SCORE<br>${state.kills} FLY KILLS • ${state.maggots} MAGGOTS<br>${acc}% ACCURACY • STAGE ${state.stage}`;$('#results').classList.add('show');playMusic('results');sfx('ui_transition')}
function pause(force){if(!state.running)return;state.paused=force===undefined?!state.paused:force;$('#pauseOverlay').classList.toggle('show',state.paused);$('#pauseBtn').src=state.paused?'ui_resume.png':'ui_pause.png';sfx('ui_tap',.2)}
const startGame=()=>{screen('play');reset()};
$('#startPopup').addEventListener('pointerdown',startGame);

$('#rulesBtn').addEventListener('pointerdown',()=>{screen('rules');sfx('ui_tap',.2)});
$('#rulesBackBtn').addEventListener('pointerdown',()=>{screen('home');sfx('ui_back',.22)});
function updateAudioIcons(){
const s=soundOn?'ui_sound_on.png':'ui_sound_off.png',m=musicOn?'ui_music_on.png':'ui_music_off.png';
$('#soundBtn').src=s;$('#homeSoundBtn').src=s;$('#homeMusicBtn').src=m;
}
$('#homeSoundBtn').addEventListener('pointerdown',()=>{soundOn=!soundOn;updateAudioIcons()});
$('#homeMusicBtn').addEventListener('pointerdown',()=>{musicOn=!musicOn;if(!musicOn)stopMusic();else playMusic(home.classList.contains('active')?'menu':'gameplay');updateAudioIcons()});
$('#pauseBtn').addEventListener('pointerdown',()=>pause());$('#resumeBtn').addEventListener('pointerdown',()=>pause(false));$('#homeBtn').addEventListener('pointerdown',()=>{state.running=false;clearAll();screen('home')});$('#retryBtn').addEventListener('pointerdown',reset);$('#resultHomeBtn').addEventListener('pointerdown',()=>{state.running=false;clearAll();screen('home')});$('#soundBtn').addEventListener('pointerdown',()=>{soundOn=!soundOn;updateAudioIcons()});$$('.pu').forEach(b=>b.addEventListener('pointerdown',()=>usePower(b.dataset.p)));window.addEventListener('blur',()=>state.running&&pause(true));
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('error',e=>{if(e.target?.tagName==='IMG'){console.error('Missing graphic:',e.target.getAttribute('src'));e.target.style.visibility='hidden'}},true);

updateAudioIcons();
})();
</script>
</body></html>
