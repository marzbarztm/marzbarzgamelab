<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

@keyframes startPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.07);filter:brightness(1.14) drop-shadow(0 8px 12px rgba(0,0,0,.8))}}

#rules{background:#050505 url('bg_rules.png') center/cover no-repeat;z-index:8}

.rulesBack img{width:100%;height:100%;object-fit:contain}

#play{background:url('bg_gameplay_01.png') center/cover no-repeat}
.hud{position:absolute;z-index:30;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;pointer-events:none}
.top{display:flex;gap:7px;align-items:flex-start;min-height:62px}.hudPanel{position:relative;width:38%;height:62px;background:center/100% 100% no-repeat;display:grid;place-items:center;text-align:center;overflow:visible}.hudPanel.score{background-image:url('hud_score_panel.png')}.hudPanel>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:3px 0 0;line-height:1}.hudPanel br{display:none}.hudPanel b{display:block;max-width:84%;font-size:15px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:clip}.hudPanel small{display:block;margin-top:0;font-size:7px;line-height:1;letter-spacing:.7px;opacity:.8}
#stageTimer{width:50px;height:48px;display:grid;place-items:center;text-align:center;background:rgba(0,0,0,.68);border:1px solid rgba(255,255,255,.22);font-weight:800;font-size:18px;line-height:1}#stageTimer small{display:block;margin-top:2px;font-size:7px;letter-spacing:1px;opacity:.75}#bonusToast{align-self:center;max-width:28%;min-height:20px;font-size:11px;font-weight:700;letter-spacing:.7px;text-align:left;text-shadow:0 2px 3px #000;opacity:0;transform:translateY(-3px);transition:opacity .12s linear,transform .12s linear;pointer-events:none}#bonusToast.show{opacity:1;transform:translateY(0)}
.hudIcon{width:38px;height:38px;object-fit:contain;pointer-events:auto;cursor:pointer}.top .hudIcon:first-of-type{margin-left:auto}
#tray{position:absolute;z-index:27;bottom:max(2px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:72%;height:auto;aspect-ratio:1639/522;background:url('hud_powerup_tray.png') center/100% 100% no-repeat;display:flex;align-items:center;justify-content:center;gap:2.5%;pointer-events:none}.pu{position:relative;width:20%;aspect-ratio:1;border:0;background:transparent;padding:0;touch-action:manipulation;pointer-events:auto}.pu img{width:100%;height:100%;object-fit:contain}.pu.empty img{visibility:hidden}.pu.disabled:not(.empty){filter:grayscale(1) brightness(.45)}.charge{display:none}
#rot{position:absolute;z-index:28;left:4%;right:4%;bottom:max(44px,calc(env(safe-area-inset-bottom) + 38px));height:34px;pointer-events:none}.rotFrame{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:2;pointer-events:none}.rotBlocks{position:absolute;left:4.5%;right:4.5%;top:27%;bottom:27%;display:grid;grid-template-columns:repeat(10,1fr);gap:4px;z-index:1}.rotBlock{background:rgba(12,8,8,.9);border:1px solid rgba(140,0,0,.32);transition:filter .08s linear,transform .08s linear}.rotBlock.filled{background:#b20d16;border-color:#ff3434;box-shadow:inset 0 0 0 1px rgba(255,0,0,.18)}.rotBlock.justFilled{animation:rotBlockPop .22s steps(2,end)}@keyframes rotBlockPop{50%{filter:brightness(2);transform:scaleY(1.3)}}
#arena{position:absolute;top:clamp(170px,37vw,210px);left:0;right:0;bottom:104px;overflow:hidden}
.sprite{position:absolute;object-fit:contain;touch-action:none;will-change:transform;z-index:8}.powerPickup{position:absolute;width:66px;height:66px;object-fit:contain;z-index:24;cursor:pointer;filter:drop-shadow(0 0 8px rgba(255,255,255,.55));animation:pickupPulse .75s ease-in-out infinite alternate}@keyframes pickupPulse{to{transform:scale(1.12);filter:drop-shadow(0 0 13px rgba(255,255,255,.9))}}.powerActor{z-index:38}.maggotFalling{filter:drop-shadow(0 5px 4px rgba(0,0,0,.55))}.fly{width:68px;height:68px}.maggot{width:56px;height:56px}.fx{position:absolute;width:80px;height:80px;object-fit:contain;pointer-events:none;z-index:12;animation:pop .35s ease-out forwards}@keyframes pop{to{transform:scale(1.4);opacity:0}}
#banner{display:none;position:absolute;z-index:45;left:50%;top:35%;transform:translate(-50%,-50%);width:86%;object-fit:contain;pointer-events:none}.showBanner{display:block!important;animation:banner .9s ease both}.stageBanner{display:block!important;opacity:0;transition:opacity .45s ease;animation:none!important}.stageBanner.visible{opacity:1}@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.75)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-50%) scale(.98)}}
#powerStage{position:absolute;inset:0;z-index:35;pointer-events:none}.powerActor{position:absolute;object-fit:contain}.dualityTarget{pointer-events:auto}
.overlay{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}.overlay.show{display:flex}.overlay .headline{width:78%;max-height:26%;object-fit:contain}.iconBtn{border:0;background:transparent;padding:0;width:72px;height:72px}.iconBtn img{width:100%;height:100%;object-fit:contain}.stats{width:82%;padding:14px;background:rgba(0,0,0,.78);border:2px solid rgba(255,255,255,.24);text-align:center;line-height:1.8}
#results{background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),url('bg_results.png') center/cover no-repeat}
.modeTag{display:none!important;position:absolute;top:122px;left:50%;transform:translateX(-50%);z-index:31;font-size:10px;letter-spacing:2px;opacity:.85;text-align:center;white-space:nowrap}.modeTag.rushVisible{display:none!important}
</style>

<body>
<div id="game">
<section id="home" class="screen active">
<img class="logo" src="logo_maggot_rush.png" alt="Maggot Rush">
<img id="startPopup" src="popup_push_to_start.png" alt="Push to Start">
<div class="homeControls">
<button id="rulesBtn" class="homeIconBtn" aria-label="Rules"><img src="icon_rules.png" alt="Rules"></button>

</section>

</section>

<div class="hud"><div class="top"><div class="hudPanel score"><div><b id="score">0</b><br><small>SCORE</small></div></div><div id="stageTimer"><div><span id="timeLeft">30</span><small>TIME</small></div></div><div id="bonusToast" aria-live="polite"></div><img id="pauseBtn" class="hudIcon" src="ui_pause.png" alt="Pause"><img id="soundBtn" class="hudIcon" src="ui_sound_on.png" alt="Sound"></div></div>

<div id="pauseOverlay" class="overlay"><img class="headline" src="popup_paused.png"><button id="resumeBtn" class="iconBtn"><img src="ui_resume.png"></button><button id="homeBtn" class="iconBtn"><img src="ui_home.png"></button></div>
<div id="results" class="overlay"><img id="resultHeadline" class="headline" src="popup_stage_failed.png" alt="Game Over"><div id="resultStats" class="stats"></div><button id="retryBtn" class="iconBtn"><img src="ui_retry.png"></button><button id="resultHomeBtn" class="iconBtn"><img src="ui_home.png"></button></div>
</section></div>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const home=$('#home'),play=$('#play'),arena=$('#arena'),banner=$('#banner'),powerStage=$('#powerStage');
const soundFiles=['ui_tap','ui_confirm','ui_back','ui_transition','fly_hit','fly_pop','fly_heavy_pop','maggot_split','maggot_pop','score_bonus','love_sick_activate','love_sick_wave','pollination_activate','pollination_freeze','magnet_activate','magnet_pull','duality_activate','duality_split'];
const sounds={};soundFiles.forEach(n=>{const a=new Audio('Audio/'+n+'.mp3');a.preload='none';if(n.includes('loop'))a.loop=true;sounds[n]=a});
let soundOn=true;function sfx(n,v=.55){if(!soundOn||!sounds[n])return;try{const a=sounds[n].cloneNode();a.volume=v;a.play().catch(()=>{})}catch{}}
let musicOn=true,currentMusic=null;
const musicFiles={menu:'Audio/music_menu.mp3',gameplay:'Audio/music_gameplay.mp3',frenzy:'Audio/music_rush.mp3',results:'Audio/music_results.mp3'};
function playMusic(key){if(currentMusic){currentMusic.pause();currentMusic=null}if(!musicOn||!musicFiles[key])return;const a=new Audio(musicFiles[key]);a.loop=true;a.volume=.38;a.play().catch(()=>{});currentMusic=a}
function stopMusic(){if(currentMusic){currentMusic.pause();currentMusic=null}}

const flyFrames={
basic:{flap:['fly_basic_flap_01.png','fly_basic_flap_02.png'],defeat:'fly_basic_defeat.png'},
fast:{flap:['fly_fast_flap_01.png','fly_fast_flap_02.png'],defeat:'fly_fast_defeat.png'},
carrier:{flap:['fly_carrier_flap_01.png','fly_carrier_flap_02.png'],defeat:'fly_carrier_defeat.png'},
heavy:{flap:['fly_heavy_flap_01.png','fly_heavy_flap_02.png'],defeat:'fly_heavy_defeat.png'},
boss:{flap:['fly_boss_flap_01.png','fly_boss_flap_02.png'],defeat:'fly_boss_defeat.png'}
};
const preload=[
...Object.values(flyFrames).flatMap(v=>[...v.flap,v.defeat]),
'maggot_crawl_01.png','maggot_crawl_02.png','fx_maggot_pop.png',
'powerup_love_sick.png','powerup_rotten_pollination.png','powerup_maggot_magnet.png','powerup_filthy_duality.png'
];preload.forEach(src=>{const i=new Image();i.src=src});
let state,actors=[],timeouts=[],raf=0,last=0,nextFly=0,nextMaggot=0,modeUntil=0,mode='normal';
let lastFlyRow=-1;
let pickup=null,powerPaused=false,freezeWorld=false,transitioning=false,bonusTimer=0,lastShownSecond=-1,magnetUntil=0,pollinationUntil=0,nextRushSpawn=0;
const MAX_FLIES_NORMAL=7,MAX_FLIES_FRENZY=10,MAX_MAGGOTS_NORMAL=7,MAX_MAGGOTS_RUSH=8,MAX_TOTAL_ACTORS=15;
const POWER_DROP_EVERY=30;
const STAGE_MS=30000;
const STAGE_CLEAR_PAUSE=2000;
const POWER_WEIGHTS=[['magnet',.40],['pollination',.30],['love',.20],['duality',.10]];
const POWER_META={
magnet:{icon:'powerup_maggot_magnet.png',popup:'popup_maggot_magnet.png',label:'MAGGOT MAGNET'},
pollination:{icon:'powerup_rotten_pollination.png',popup:'popup_rotten_pollination.png',label:'ROTTEN POLLINATION'},
love:{icon:'powerup_love_sick.png',popup:'popup_love_sick.png',label:'LOVE SICK'},
duality:{icon:'powerup_filthy_duality.png',popup:'popup_filthy_duality.png',label:'FILTHY DUALITY'}
};
const fresh=()=>({running:false,paused:false,score:0,hits:0,misses:0,kills:0,maggots:0,rot:0,stage:1,stageRemaining:STAGE_MS,inRedemption:false,rushRemaining:0,rushKills:0,rushTarget:12,rushCount:0,powers:{love:0,pollination:0,magnet:0,duality:0},activePower:null});state=fresh();
function later(fn,ms){const id=setTimeout(fn,ms);timeouts.push(id);return id}function clearAll(){timeouts.forEach(clearTimeout);timeouts=[];cancelAnimationFrame(raf);actors.forEach(a=>a.el?.remove());actors=[];lastFlyRow=-1;if(pickup){pickup.remove();pickup=null}}
function screen(name){home.classList.toggle('active',name==='home');$('#rules').classList.toggle('active',name==='rules');play.classList.toggle('active',name==='play')}
let lastRotBlocks=0;function updateTimer(force=false){const remaining=state.inRedemption?state.rushRemaining:state.stageRemaining;const sec=Math.max(0,Math.ceil((remaining||0)/1000));if(force||sec!==lastShownSecond){lastShownSecond=sec;const el=$('#timeLeft');if(el)el.textContent=sec}}function hud(){$('#score').textContent=state.score;updateTimer();const filled=Math.max(0,Math.min(10,Math.floor(state.rot/10)));$$('.rotBlock').forEach((b,i)=>{const on=i<filled;b.classList.toggle('filled',on);if(on&&i>=lastRotBlocks){b.classList.remove('justFilled');void b.offsetWidth;b.classList.add('justFilled')}else if(!on)b.classList.remove('justFilled')});lastRotBlocks=filled;$$('.pu').forEach(b=>{const p=b.dataset.p,c=state.powers[p];b.classList.toggle('empty',!c);b.classList.toggle('disabled',!!state.activePower&&state.activePower!==p)})}
function showBonus(text,ms=950){const el=$('#bonusToast');if(!el)return;clearTimeout(bonusTimer);el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');bonusTimer=setTimeout(()=>{el.classList.remove('show');el.textContent=''},ms)}
function showBanner(src,ms=1000){banner.src=src;banner.classList.remove('stageBanner','visible','showBanner');void banner.offsetWidth;banner.classList.add('showBanner');later(()=>banner.classList.remove('showBanner'),ms)}
function showStageBanner(src,hold=4200){banner.src=src;banner.classList.remove('showBanner','stageBanner','visible');banner.classList.add('stageBanner');requestAnimationFrame(()=>banner.classList.add('visible'));later(()=>banner.classList.remove('visible'),hold);later(()=>banner.classList.remove('stageBanner'),hold+500)}
function addFx(x,y,src){const e=new Image();e.className='fx';e.src=src;e.style.left=x+'px';e.style.top=y+'px';arena.appendChild(e);later(()=>e.remove(),380)}
function countKind(kind){return actors.reduce((n,a)=>n+(!a.dead&&a.kind===kind?1:0),0)}
function findFlySpawnX(minDist=76){
const maxX=Math.max(1,arena.clientWidth-68);
const topFlies=actors.filter(a=>a.kind==='fly'&&!a.dead&&a.y<110);
for(let i=0;i<16;i++){
const x=Math.random()*maxX;
if(topFlies.every(a=>Math.abs(a.x-x)>=minDist))return x;
}
return Math.random()*maxX;
}
function addFly(type='basic'){
if(!state.running||state.paused||powerPaused||state.inRedemption)return;
const flyCap=mode==='flyFrenzy'?MAX_FLIES_FRENZY:MAX_FLIES_NORMAL;
if(countKind('fly')>=flyCap||actors.length>=MAX_TOTAL_ACTORS)return;
const spec=flyFrames[type]||flyFrames.basic,frames=spec.flap,e=new Image();
e.className='sprite fly';e.src=frames[0];arena.appendChild(e);
const hp=type==='boss'?4:type==='heavy'?2:1;
const baseFall=type==='fast'?138:type==='heavy'?88:type==='carrier'?106:type==='boss'?78:104;
const roundSpeed=Math.pow(1.05,Math.max(0,state.stage-1));
const vy=baseFall*roundSpeed;
const x=findFlySpawnX(),vx=(Math.random()-.5)*34,phase=Math.random()*Math.PI*2;
const a={kind:'fly',type,el:e,frames,defeat:spec.defeat,frame:0,lastFrame:0,
x,y:-70,vx,vy,hp,phase};
actors.push(a);
if(state.activePower==='pollination'&&performance.now()<pollinationUntil)schedulePollinationFreeze(a);
e.addEventListener('pointerdown',ev=>{
ev.preventDefault();
if(a.dead||state.paused||(powerPaused&&!freezeWorld))return;
a.hp--;
if(a.hp<=0)killFly(a);
});
}
function flyEscaped(a){
if(a.dead)return;
a.dead=true;
a.el.remove();
actors=actors.filter(x=>x!==a);
state.misses++;
state.rot=Math.min(100,state.rot+10);
sfx('maggot_warning',.2);
hud();
if(state.rot>=100)startMaggotRedemption();
}
function killFly(a){
if(a.dead)return;
a.dead=true;
actors=actors.filter(x=>x!==a);
state.kills++;state.hits++;
state.score+=(a.type==='boss'?10:a.type==='heavy'?4:a.type==='carrier'?3:a.type==='fast'?2:1);
a.el.src=a.defeat;a.el.style.pointerEvents='none';
later(()=>a.el.remove(),180);
sfx(a.type==='heavy'||a.type==='boss'?'fly_heavy_pop':'fly_pop',.30);

if(a.type==='carrier')later(()=>addMaggot(a.x+6,a.y+24,90,'carrier'),70);
if(state.kills>0&&state.kills%POWER_DROP_EVERY===0)spawnPowerPickup();
hud();
}
function maggotDistanceOK(x,y,minDist=75){return !actors.some(o=>o.kind==='maggot'&&!o.dead&&Math.abs(o.x-x)<minDist&&Math.abs(o.y-y)<90)}
function findMaggotX(preferredX=null,minDist=75){const maxX=Math.max(1,arena.clientWidth-56);for(let i=0;i<18;i++){const x=preferredX==null?Math.random()*maxX:Math.max(0,Math.min(maxX,preferredX+(Math.random()*120-60)));if(maggotDistanceOK(x,-55,minDist))return x}return Math.random()*maxX}
function addMaggot(x=null,y=null,minDist=75,source='sky'){if(!state.running||state.paused||powerPaused||transitioning)return;if(state.inRedemption&&source!=='rush')return;const cap=state.inRedemption?MAX_MAGGOTS_RUSH:(mode==='maggotRush'?MAX_MAGGOTS_RUSH:MAX_MAGGOTS_NORMAL);if(countKind('maggot')>=cap||actors.length>=MAX_TOTAL_ACTORS)return;const startX=findMaggotX(x,minDist),startY=y==null?-58:Math.max(-58,Math.min(arena.clientHeight*.7,y));const e=new Image();e.className='sprite maggot maggotFalling';e.src='maggot_crawl_01.png';arena.appendChild(e);const a={kind:'maggot',el:e,x:startX,y:startY,vy:source==='rush'?285+Math.random()*55:source==='carrier'?210+Math.random()*55:245+Math.random()*70,frame:0,lastFrame:0,source};actors.push(a);state.maggots++;if(state.activePower==='pollination'&&performance.now()<pollinationUntil)schedulePollinationFreeze(a);e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(a.dead||state.paused||powerPaused)return;killMaggot(a)})}
function killMaggot(a){if(a.dead)return;a.dead=true;a.el.remove();actors=actors.filter(x=>x!==a);state.score+=1;state.hits++;addFx(a.x,a.y,'fx_maggot_pop.png');sfx('maggot_pop',.32);if(state.inRedemption){state.rushKills++;if(state.rushKills>=state.rushTarget){finishMaggotRedemption(true);return}}hud()}
function maggotLanded(a){if(a.dead)return;a.dead=true;a.el.remove();actors=actors.filter(x=>x!==a);if(state.inRedemption){state.misses++;hud();return}state.rot=Math.min(100,state.rot+10);sfx('maggot_split',.28);hud();if(state.rot>=100){startMaggotRedemption();return}for(let i=0;i<2;i++)later(()=>{if(state.running&&!state.paused&&!transitioning&&!state.inRedemption)addMaggot(null,-58,82,'sky')},220+i*180)}

function loop(t){

}else{

if(state.stageRemaining<=0){completeInfestation();raf=requestAnimationFrame(loop);return}

if(a.dead||t<(a.frozenUntil||0))continue;

const targetX=arena.clientWidth*.5-(a.kind==='fly'?34:28),targetY=arena.clientHeight-(a.kind==='fly'?92:82);

a.el.style.pointerEvents='none';

continue;
}

if(a.y>=arena.clientHeight-68){a.y=arena.clientHeight-68;a.el.style.transform=`translate3d(${a.x}px,${a.y}px,0)`;flyEscaped(a);continue}
}else{
a.y+=a.vy*dt;

}

const startGame=()=>{screen('play');reset()};
function goHome(){
state.running=false;state.paused=false;clearAll();powerPaused=false;freezeWorld=false;transitioning=false;pickup=null;mode='normal';modeUntil=0;last=0;lastRotBlocks=0;lastFlyRow=-1;magnetUntil=0;pollinationUntil=0;nextRushSpawn=0;clearTimeout(bonusTimer);
arena.innerHTML='';powerStage.innerHTML='';banner.classList.remove('showBanner');$('#modeTag').classList.remove('rushVisible');$('#results').classList.remove('show');$('#pauseOverlay').classList.remove('show');$('#pauseBtn').src='ui_pause.png';
screen('home');updateAudioIcons();if(musicOn)playMusic('menu');else stopMusic();
}
function bindPress(el,fn){if(!el)return;el.addEventListener('pointerdown',ev=>{ev.preventDefault();ev.stopPropagation();fn(ev)},{passive:false})}
bindPress($('#startPopup'),startGame);
bindPress($('#rulesBtn'),()=>{screen('rules');sfx('ui_tap',.2)});
bindPress($('#rulesBackBtn'),()=>{screen('home');sfx('ui_back',.22)});
function updateAudioIcons(){
const s=soundOn?'ui_sound_on.png':'ui_sound_off.png',m=musicOn?'ui_music_on.png':'ui_music_off.png';
$('#soundBtn').src=s;const hs=$('#homeSoundBtn img'),hm=$('#homeMusicBtn img');if(hs){hs.src=s;hs.alt=soundOn?'Sound on':'Sound off'}if(hm){hm.src=m;hm.alt=musicOn?'Music on':'Music off'}
$('#homeSoundBtn').setAttribute('aria-label',soundOn?'Sound on':'Sound off');$('#homeMusicBtn').setAttribute('aria-label',musicOn?'Music on':'Music off');
}
bindPress($('#homeSoundBtn'),()=>{soundOn=!soundOn;updateAudioIcons()});
bindPress($('#homeMusicBtn'),()=>{musicOn=!musicOn;updateAudioIcons();requestAnimationFrame(()=>{if(!musicOn)stopMusic();else playMusic(home.classList.contains('active')?'menu':'gameplay')})});
bindPress($('#pauseBtn'),()=>pause());bindPress($('#resumeBtn'),()=>pause(false));bindPress($('#homeBtn'),goHome);bindPress($('#retryBtn'),reset);bindPress($('#resultHomeBtn'),goHome);bindPress($('#soundBtn'),()=>{soundOn=!soundOn;updateAudioIcons()});$$('.pu').forEach(b=>bindPress(b,()=>usePower(b.dataset.p)));window.addEventListener('blur',()=>state.running&&pause(true));
['gesturestart','gesturechange','gestureend'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('error',e=>{if(e.target?.tagName==='IMG'){console.error('Missing graphic:',e.target.getAttribute('src'));e.target.style.visibility='hidden'}},true);

updateAudioIcons();
})();
</script>
</body></html>
