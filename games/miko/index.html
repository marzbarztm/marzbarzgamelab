<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#06144f">
<title>Miko's Super Spider Adventure</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030820;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white;touch-action:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center;background:#020619}
  canvas{display:block;max-width:100vw;max-height:100vh;image-rendering:auto;background:#07124b}
  #controls{position:fixed;z-index:4;inset:auto 0 max(14px,env(safe-area-inset-bottom)) 0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 clamp(14px,4vw,34px);pointer-events:none}
  .control-side{display:flex;pointer-events:none}.right-controls{flex-direction:column;align-items:center;gap:12px}
  .btn{pointer-events:auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:118px;height:82px;border:3px solid #fff5c7;border-radius:24px;background:linear-gradient(180deg,rgba(73,84,255,.94),rgba(25,35,145,.94));color:white;font-weight:950;letter-spacing:.6px;text-shadow:0 2px 0 #111a66;box-shadow:0 7px 0 #111752,0 10px 18px #0008,inset 0 3px 0 #ffffff66;backdrop-filter:blur(4px);-webkit-user-select:none;user-select:none}
  .btn .icon{font-size:31px;line-height:1;filter:drop-shadow(0 2px 0 #10164f)}.btn .label{font-size:13px;line-height:1}
  #web{width:132px;height:88px;background:linear-gradient(180deg,rgba(255,66,103,.97),rgba(153,20,63,.97));box-shadow:0 7px 0 #71102f,0 10px 18px #0008,inset 0 3px 0 #ffffff66}
  #jump{width:132px;height:96px;background:linear-gradient(180deg,rgba(42,215,247,.97),rgba(20,91,188,.97));box-shadow:0 7px 0 #103e81,0 10px 18px #0008,inset 0 3px 0 #ffffff66}
  #slide{width:116px;height:72px;background:linear-gradient(180deg,rgba(255,184,46,.98),rgba(187,80,13,.98));box-shadow:0 7px 0 #7a350b,0 10px 18px #0008,inset 0 3px 0 #ffffff66}
  .btn:active,.btn.pressed{transform:translateY(5px) scale(.98);box-shadow:0 2px 0 #111752,0 5px 10px #0008,inset 0 2px 0 #ffffff55}
  #sound{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:3;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff80;background:#07133fcc;color:white;font-size:18px}
  @media (max-width:430px){#controls{padding:0 12px}.btn{width:104px;height:76px;border-radius:21px}#web{width:116px;height:82px}#jump{width:116px;height:90px}#slide{width:104px;height:66px}.btn .icon{font-size:27px}.btn .label{font-size:12px}}
  @media (hover:hover) and (pointer:fine){#controls{opacity:.68}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="720" height="1280" aria-label="Miko's Super Spider Adventure"></canvas></div>
<button id="sound" aria-label="Toggle sound">🔊</button>
<div id="controls" aria-label="Game controls">
  <div class="control-side left-controls">
    <button class="btn" id="web" aria-label="Shoot web"><span class="icon" aria-hidden="true">🕸️</span><span class="label">WEB</span></button>
  </div>
  <div class="control-side right-controls">
    <button class="btn" id="slide" aria-label="Slide"><span class="icon" aria-hidden="true">⬇️</span><span class="label">SLIDE</span></button>
    <button class="btn" id="jump" aria-label="Jump"><span class="icon" aria-hidden="true">⬆️</span><span class="label">JUMP</span></button>
  </div>
</div>
<script>
'use strict';
const C=document.getElementById('game'),X=C.getContext('2d');
const W=C.width,H=C.height,GROUND=930;
const $=id=>document.getElementById(id);
const A={};
const files={
 bg:'GamePlay Background.png',logo:'MikosSuperGame Logo.png',run:'MIKO-Running.png',jump:'Miko-JUMP.png',hurt:'MIKO-Hurt.png',front:'MIKO-Front.png',power:'SUPERMIKO.png',basic:'10.png',zig:'11.png',boss:'12.png',coin:'Spider Coin.png',meter:'Power Meter Collectible.png',heart:'Bonus Life Heart.png',web:'Web Shot Projectile.png',enemyShot:'Enemy Attack Projectile.png',bossShot:'Boss Attack.png',vent:'Small Rooftop Vent.png',pipes:'Rooftop Pipes.png',ac:'Large Air-Conditioning Unit.png',dish:'Satellite Dish.png',ebox:'Electrical Box.png',hazard:'Hazard.png',floor:'Floor Hazard.png',gameover:'GameOver.png',gameoverBg:'GAMEOVER Background.png',high:'New High Score.png',you:'YOUDIDIT.png',amazing:'AMAZING.png',bonus:'Bonus.png'
};
let loaded=0; Object.entries(files).forEach(([k,v])=>{let i=new Image();i.onload=i.onerror=()=>loaded++;i.src=encodeURI(v);A[k]=i});
const audio={music:new Audio('background_music.MP3'),jump:new Audio('sfx_jump.wav.mp3'),damage:new Audio('sfx_damagetaken.WAV'),over:new Audio('gsfx_gameover.WAV'),high:new Audio('sfx_newhighschore.WAV'),ready:new Audio('sfx_power_ready.wav.mp3')};
audio.music.loop=true;audio.music.volume=.28;Object.values(audio).forEach(a=>a.preload='auto');let muted=false;
function sfx(k){if(muted)return;const a=audio[k];if(!a)return;try{a.currentTime=0;a.play()}catch{}}
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';audio.music.muted=muted};
function fit(){const r=Math.min(innerWidth/W,innerHeight/H);C.style.width=(W*r)+'px';C.style.height=(H*r)+'px'}addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function img(im,x,y,w,h,alpha=1){if(!im||!im.complete)return;X.save();X.globalAlpha=alpha;X.drawImage(im,x,y,w,h);X.restore()}
let state='title',score=0,coins=0,lives=3,wave=1,loop=1,waveTime=0,banner=0,bannerText='',speed=8,spawnT=80,enemyT=120,coinT=30,lastHazard=-999,lastEnemy=-999,power=0,powerMode=0,inv=0,boss=null,high=+localStorage.getItem('mikoHigh')||0,newHigh=false;
let objects=[],shots=[],enemyShots=[],particles=[];
const P={x:118,y:GROUND-158,w:105,h:150,vy:0,onGround:true,jumps:0,slide:0,shoot:0,hurt:0};
const waveNames=['ROOFTOP TRAINING','FIRST CONTACT','AIR PATROL','FULL ASSAULT','BOSS ENCOUNTER','ROOFTOP CHAOS','ELITE PATROL','SWARM ATTACK','SURVIVAL','FINAL SHOWDOWN'];
function reset(){score=0;coins=0;lives=3;wave=1;loop=1;waveTime=0;speed=8;spawnT=75;enemyT=150;coinT=20;power=0;powerMode=0;inv=0;boss=null;objects=[];shots=[];enemyShots=[];particles=[];Object.assign(P,{x:118,y:GROUND-158,vy:0,onGround:true,jumps:0,slide:0,shoot:0,hurt:0});state='play';showBanner('WAVE 1 — '+waveNames[0],150);try{audio.music.play()}catch{}}
function showBanner(t,d=100){bannerText=t;banner=d}
function jump(){if(state==='title'||state==='over'){reset();return}if(state!=='play')return;if(P.jumps<2){P.vy=P.jumps? -19:-22;P.onGround=false;P.jumps++;P.slide=0;sfx('jump')}}
function slide(on=true){if(state==='play'&&P.onGround)P.slide=on?20:0}
function fire(){if(state!=='play'||P.shoot>0||powerMode)return;P.shoot=12;shots.push({x:P.x+P.w-4,y:P.y+48,w:44,h:18,vx:17,dead:false})}
function bind(id,down,up){let b=$(id);['pointerdown','touchstart'].forEach(e=>b.addEventListener(e,z=>{z.preventDefault();down()}));['pointerup','pointercancel','touchend'].forEach(e=>b.addEventListener(e,z=>{z.preventDefault();up&&up()}))}
bind('jump',jump);bind('web',fire);bind('slide',()=>slide(true),()=>slide(false));
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();jump()}if(['ArrowDown','KeyS'].includes(e.code))slide(true);if(['KeyX','KeyF','Enter'].includes(e.code))fire()});addEventListener('keyup',e=>{if(['ArrowDown','KeyS'].includes(e.code))slide(false)});C.addEventListener('pointerdown',e=>{if(state!=='play')jump()});
function spawnObstacle(){if(powerMode||boss)return;const gapSinceEnemy=performance.now()-lastEnemy;if(gapSinceEnemy<1150)return;let choices=[['vent',82,80],['pipes',125,92],['ebox',90,105],['dish',115,110],['ac',155,125]];let q=choices[(Math.random()*choices.length)|0];objects.push({kind:'obstacle',sprite:q[0],x:W+20,y:GROUND-q[2],w:q[1],h:q[2],dead:false});lastHazard=performance.now()}
function enemyMix(){if(wave<2)return null;if(wave===2)return'basic';if(wave===3)return Math.random()<.25?'zig':'basic';if(wave===4)return Math.random()<.5?'zig':'basic';if(wave===5)return Math.random()<.2?'basic':null;if(wave===6)return Math.random()<.45?'zig':'basic';if(wave===7)return Math.random()<.7?'zig':'basic';if(wave===8)return Math.random()<.55?'zig':'basic';if(wave===9)return Math.random()<.6?'zig':'basic';return Math.random()<.45?'zig':'basic'}
function spawnEnemy(){if(powerMode||boss&&wave===5)return; if(performance.now()-lastHazard<1350)return;let type=enemyMix();if(!type)return;let zig=type==='zig';objects.push({kind:'enemy',type,sprite:zig?'zig':'basic',x:W+20,y:rnd(510,720),w:zig?105:94,h:zig?98:88,hp:zig?2:1,baseY:0,t:0,dead:false});lastEnemy=performance.now()}
function spawnCoin(frenzy=false){let n=frenzy?1:(Math.random()<.18?3:1);for(let i=0;i<n;i++)objects.push({kind:'coin',sprite:'coin',x:W+30+i*54,y:frenzy?rnd(210,840):rnd(580,845),w:48,h:48,dead:false,vx:frenzy?rnd(8,12):speed})}
function spawnMeter(){objects.push({kind:'meter',sprite:'meter',x:W+30,y:rnd(600,820),w:52,h:52,dead:false})}
function spawnBoss(){boss={x:W-190,y:390,w:165,h:165,hp:5,max:5,t:0,shot:65,dead:false};showBanner(wave===10?'FINAL BOSS!':'BOSS APPROACHING!',130)}
function damage(){if(inv||powerMode||state!=='play')return;lives--;inv=100;P.hurt=35;sfx('damage');burst(P.x+55,P.y+70,'#ff334f',18);if(lives<=0)endGame()}
function endGame(){state='over';audio.music.pause();sfx('over');newHigh=score>high;if(newHigh){high=score;localStorage.setItem('mikoHigh',high);setTimeout(()=>sfx('high'),450)}}
function activatePower(){power=0;powerMode=600;objects=objects.filter(o=>o.kind==='coin');enemyShots=[];boss=null;showBanner('MIKO POWER — COIN FRENZY!',120);sfx('ready')}
function burst(x,y,c,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-5,5),vy:rnd(-8,1),life:rnd(18,40),c})}
function nextWave(){wave++;if(wave>10){wave=1;loop++;speed+=1.3;showBanner('LOOP '+loop+' — FASTER!',150)}else showBanner('WAVE '+wave+' — '+waveNames[wave-1],140);waveTime=0;objects=[];enemyShots=[];boss=null;if(wave===5||wave===10)setTimeout(()=>{if(state==='play'&&!powerMode)spawnBoss()},900)}
function update(){if(state!=='play')return;score+=.12*loop;waveTime++;let targetSpeed=8+(wave-1)*.42+(loop-1)*1.25;speed+=(targetSpeed-speed)*.01;if(waveTime>=900)nextWave();if(banner>0)banner--;if(inv>0)inv--;if(P.hurt>0)P.hurt--;if(P.shoot>0)P.shoot--;if(P.slide>0)P.slide--;
 P.vy+=1.2;P.y+=P.vy;let ph=P.slide?82:150;if(P.y>GROUND-ph){P.y=GROUND-ph;P.vy=0;P.onGround=true;P.jumps=0}else P.onGround=false;P.h=ph;
 if(powerMode>0){powerMode--;coinT--;if(coinT<=0){spawnCoin(true);coinT=rnd(8,16)}if(powerMode===0){showBanner('BACK TO THE ACTION!',80);if(wave===5||wave===10)spawnBoss()}}
 else{
   spawnT--;enemyT--;coinT--;
   if(spawnT<=0){spawnObstacle();spawnT=rnd(105,160)-wave*2}
   if(enemyT<=0){spawnEnemy();enemyT=rnd(115,175)-wave*2}
   if(coinT<=0){spawnCoin(false);if(Math.random()<.08)spawnMeter();coinT=rnd(35,65)}
 }
 for(const o of objects){o.t=(o.t||0)+1;o.x-=o.vx||speed;if(o.kind==='enemy'){o.x-=o.type==='zig'?speed*.18:speed*.45;if(o.type==='zig')o.y+=Math.sin(o.t*.11)*3}if(o.x+o.w<-50)o.dead=true;
   if(!o.dead&&hit(P,o)){if(o.kind==='coin'){o.dead=true;coins++;score+=100;burst(o.x+24,o.y+24,'#ffd34a',7)}else if(o.kind==='meter'){o.dead=true;power=clamp(power+25,0,100);score+=150;if(power>=100)activatePower()}else{damage();o.dead=true}}
 }
 for(const sh of shots){sh.x+=sh.vx;if(sh.x>W+50)sh.dead=true;for(const o of objects)if(!sh.dead&&!o.dead&&o.kind==='enemy'&&hit(sh,o)){sh.dead=true;o.hp--;burst(sh.x,sh.y,'#8eeaff',8);if(o.hp<=0){o.dead=true;score+=o.type==='zig'?350:200;burst(o.x+o.w/2,o.y+o.h/2,'#ff576b',18)}}if(boss&&!sh.dead&&hit(sh,boss)){sh.dead=true;boss.hp--;burst(sh.x,sh.y,'#ffe05e',10);if(boss.hp<=0){score+=2000;burst(boss.x+80,boss.y+80,'#ffcf35',45);boss=null;showBanner('BOSS DEFEATED!',140)}}}
 if(boss){boss.t++;boss.y=400+Math.sin(boss.t*.035)*145;boss.shot--;if(boss.shot<=0){enemyShots.push({x:boss.x+20,y:boss.y+80,w:44,h:44,vx:-9});boss.shot=wave===10?42:58}}
 for(const q of enemyShots){q.x+=q.vx;if(q.x<-60)q.dead=true;if(!q.dead&&hit(P,q)){q.dead=true;damage()}}
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.life--}
 objects=objects.filter(o=>!o.dead);shots=shots.filter(o=>!o.dead);enemyShots=enemyShots.filter(o=>!o.dead);particles=particles.filter(p=>p.life>0)
}
function drawBg(){img(A.bg,0,0,W,H);X.fillStyle='rgba(4,8,40,.08)';X.fillRect(0,0,W,H)}
function drawPlayer(){let im=P.hurt?A.hurt:powerMode?A.power:(!P.onGround?A.jump:A.run);if(inv&&Math.floor(inv/5)%2)return;let w=P.slide?125:128,h=P.slide?95:165,y=P.slide?GROUND-95:P.y;img(im,P.x-10,y-8,w,h)}
function drawHUD(){X.save();X.fillStyle='rgba(3,8,35,.72)';X.fillRect(14,14,W-28,105);X.fillStyle='#fff';X.font='900 27px system-ui';X.fillText('SCORE '+Math.floor(score),28,50);X.fillText('WAVE '+wave+'/10',28,88);X.textAlign='right';X.fillText('♥ '.repeat(lives),W-28,50);X.fillStyle='#ffd84a';X.fillText('COINS '+coins,W-28,88);X.textAlign='left';X.fillStyle='#222';X.fillRect(210,67,300,25);X.fillStyle=powerMode?'#ffe350':'#32d3ff';X.fillRect(213,70,294*(powerMode?powerMode/600:power/100),19);X.strokeStyle='#fff';X.strokeRect(210,67,300,25);X.font='800 15px system-ui';X.fillStyle='#fff';X.fillText(powerMode?'COIN FRENZY':'MIKO POWER',306,63);if(boss){X.fillStyle='#1b0d18';X.fillRect(155,128,410,28);X.fillStyle='#ff334f';X.fillRect(159,132,402*(boss.hp/boss.max),20);X.strokeStyle='#fff';X.strokeRect(155,128,410,28)}X.restore()}
function drawGame(){drawBg();for(const o of objects){if(o.kind==='enemy')img(A[o.sprite],o.x,o.y,o.w,o.h);else img(A[o.sprite],o.x,o.y,o.w,o.h)}for(const s of shots)img(A.web,s.x,s.y,s.w,s.h);for(const q of enemyShots)img(A.enemyShot,q.x,q.y,q.w,q.h);if(boss)img(A.boss,boss.x,boss.y,boss.w,boss.h);drawPlayer();for(const p of particles){X.globalAlpha=clamp(p.life/35,0,1);X.fillStyle=p.c;X.fillRect(p.x,p.y,6,6)}X.globalAlpha=1;drawHUD();if(banner>0){X.fillStyle='rgba(0,0,0,.62)';X.fillRect(0,445,W,130);X.textAlign='center';X.fillStyle='#fff';X.font='900 34px system-ui';X.fillText(bannerText,W/2,522);X.textAlign='left'}}
function drawTitle(){drawBg();X.fillStyle='rgba(0,0,20,.28)';X.fillRect(0,0,W,H);img(A.logo,65,125,590,285);img(A.front,210,440,300,300);X.textAlign='center';X.font='900 30px system-ui';X.fillStyle='#fff';X.fillText('TAP JUMP TO START',W/2,810);X.font='700 20px system-ui';X.fillText('Jump • Double Jump • Web • Slide',W/2,855);X.fillStyle='rgba(3,8,35,.75)';X.fillRect(95,900,530,120);X.fillStyle='#ffd84a';X.fillText('10 WAVES • BOSS BATTLES • COIN FRENZY',W/2,953);X.fillStyle='#fff';X.font='600 17px system-ui';X.fillText('Wave 1 teaches obstacles. Enemies arrive one wave at a time.',W/2,990);X.textAlign='left'}
function drawOver(){img(A.gameoverBg,0,0,W,H);X.fillStyle='rgba(0,0,15,.25)';X.fillRect(0,0,W,H);img(A.gameover,95,115,530,250);if(newHigh)img(A.high,115,385,490,250);X.textAlign='center';X.fillStyle='#fff';X.font='900 39px system-ui';X.fillText('SCORE '+Math.floor(score),W/2,730);X.font='800 27px system-ui';X.fillText('HIGH SCORE '+high,W/2,780);X.fillStyle='#ffd84a';X.fillText('WAVE '+wave+'  •  COINS '+coins,W/2,830);X.fillStyle='#fff';X.font='900 27px system-ui';X.fillText('TAP JUMP TO PLAY AGAIN',W/2,925);X.textAlign='left'}
function loopFn(){X.clearRect(0,0,W,H);if(state==='title')drawTitle();else if(state==='play'){update();drawGame()}else drawOver();requestAnimationFrame(loopFn)}
loopFn();
</script>
</body>
</html>
